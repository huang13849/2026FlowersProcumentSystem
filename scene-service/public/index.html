<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>庭院园林 · 成功案例场景图管理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0f1115; color: #e7e9ee; padding: 24px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #8b919e; font-size: 13px; margin-bottom: 20px; }
  .bar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  select, input, textarea, button { font-size: 14px; padding: 8px 10px; border-radius: 8px; border: 1px solid #2a2f3a; background: #181b22; color: #e7e9ee; }
  button { cursor: pointer; background: #1f6f43; border-color: #1f6f43; color: #fff; font-weight: 600; }
  button.ghost { background: #181b22; border-color: #2a2f3a; color: #9aa1ad; }
  button.danger { background: #7a2230; border-color: #7a2230; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card { background: #161922; border: 1px solid #242935; border-radius: 14px; overflow: hidden; }
  .card .thumb { width: 100%; height: 160px; object-fit: cover; background: #20242e; display: block; }
  .card .body { padding: 12px; }
  .card .tag { display: inline-block; font-size: 11px; background: #1f6f43; padding: 2px 8px; border-radius: 999px; margin-bottom: 6px; }
  .card h3 { font-size: 15px; margin-bottom: 4px; }
  .card p { font-size: 12px; color: #9aa1ad; line-height: 1.5; min-height: 34px; }
  .card .meta { font-size: 11px; color: #6b7280; margin: 8px 0; }
  .card .ops { display: flex; gap: 8px; }
  .card .ops button { flex: 1; font-size: 12px; padding: 6px; }
  .region-pill { font-size: 10px; padding: 2px 6px; border-radius: 6px; background: #28324a; color: #9db4e0; margin-left: 6px; }
  .off { opacity: .45; }
  dialog { border: none; border-radius: 16px; background: #161922; color: #e7e9ee; padding: 0; width: min(520px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  .modal-head { padding: 16px 20px; border-bottom: 1px solid #242935; font-size: 17px; font-weight: 700; }
  .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .modal-body label { font-size: 12px; color: #9aa1ad; display: block; margin-bottom: 4px; }
  .modal-body input, .modal-body textarea, .modal-body select { width: 100%; }
  .modal-foot { padding: 14px 20px; border-top: 1px solid #242935; display: flex; justify-content: flex-end; gap: 10px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .empty { color: #6b7280; padding: 40px; text-align: center; }
  #preview { width: 100%; height: 140px; object-fit: cover; border-radius: 10px; display: none; background: #20242e; }
</style>
</head>
<body>
  <h1>庭院园林 · 成功案例场景图管理</h1>
  <div class="sub">scene-service · 图片存 MinIO，元数据存 MongoDB。region=cn 仅国内版 / global 仅国际版 / all 两版都显示。</div>
  <div class="bar">
    <label>筛选区域：</label>
    <select id="filterRegion">
      <option value="all">全部</option>
      <option value="cn">国内版 (cn)</option>
      <option value="global">国际版 (global)</option>
    </select>
    <button onclick="openCreate()">+ 新增场景</button>
    <button class="ghost" onclick="load()">刷新</button>
  </div>
  <div id="list" class="grid"></div>

  <dialog id="dlg">
    <form id="form" onsubmit="return submitForm(event)">
      <div class="modal-head" id="dlgTitle">新增场景</div>
      <div class="modal-body">
        <input type="hidden" id="f_id" />
        <div>
          <label>标题</label>
          <input id="f_title" required placeholder="如：北京别墅庭院改造" />
        </div>
        <div>
          <label>描述</label>
          <textarea id="f_desc" rows="2" placeholder="如：25棵白皮松 + 80棵月季，30天从裸地到花园"></textarea>
        </div>
        <div class="row2">
          <div>
            <label>标签 (tag)</label>
            <input id="f_tag" placeholder="别墅庭院" />
          </div>
          <div>
            <label>展示区域</label>
            <select id="f_region">
              <option value="all">两版都显示 (all)</option>
              <option value="cn">仅国内版 (cn)</option>
              <option value="global">仅国际版 (global)</option>
            </select>
          </div>
        </div>
        <div class="row2">
          <div>
            <label>排序 (越小越靠前)</label>
            <input id="f_sort" type="number" value="0" />
          </div>
          <div>
            <label>启用</label>
            <select id="f_enabled"><option value="true">启用</option><option value="false">停用</option></select>
          </div>
        </div>
        <div>
          <label>场景图片 (新增必传 / 修改不选则保留原图)</label>
          <input id="f_image" type="file" accept="image/*" onchange="previewImg(event)" />
          <img id="preview" />
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="ghost" onclick="document.getElementById('dlg').close()">取消</button>
        <button type="submit">保存</button>
      </div>
    </form>
  </dialog>

<script>
const API = '/api/scenes';
let editing = null;

async function load() {
  const region = document.getElementById('filterRegion').value;
  const url = region === 'all' ? API : API + '?region=' + region;
  const res = await fetch(url);
  const data = await res.json();
  const list = document.getElementById('list');
  if (!data.scenes || !data.scenes.length) { list.innerHTML = '<div class="empty">暂无场景图，点「+ 新增场景」添加。</div>'; return; }
  list.innerHTML = data.scenes.map(s => `
    <div class="card ${s.enabled ? '' : 'off'}">
      <img class="thumb" src="${s.imageUrlAbsolute || s.imageUrl}" alt="" onerror="this.style.opacity=.2" />
      <div class="body">
        <span class="tag">${esc(s.tag) || '场景'}</span><span class="region-pill">${s.region}</span>
        <h3>${esc(s.title)}</h3>
        <p>${esc(s.desc)}</p>
        <div class="meta">排序 ${s.sortOrder} · ${s.enabled ? '启用' : '停用'}</div>
        <div class="ops">
          <button class="ghost" onclick='openEdit(${JSON.stringify(s)})'>编辑</button>
          <button class="danger" onclick="del('${s.id}','${esc(s.title)}')">删除</button>
        </div>
      </div>
    </div>`).join('');
}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function previewImg(e){const f=e.target.files[0];const p=document.getElementById('preview');if(f){p.src=URL.createObjectURL(f);p.style.display='block';}else{p.style.display='none';}}

function openCreate() {
  editing = null;
  document.getElementById('dlgTitle').innerText = '新增场景';
  document.getElementById('form').reset();
  document.getElementById('f_id').value = '';
  document.getElementById('preview').style.display = 'none';
  document.getElementById('f_image').required = true;
  document.getElementById('dlg').showModal();
}
function openEdit(s) {
  editing = s.id;
  document.getElementById('dlgTitle').innerText = '编辑场景';
  document.getElementById('f_id').value = s.id;
  document.getElementById('f_title').value = s.title;
  document.getElementById('f_desc').value = s.desc;
  document.getElementById('f_tag').value = s.tag;
  document.getElementById('f_region').value = s.region;
  document.getElementById('f_sort').value = s.sortOrder;
  document.getElementById('f_enabled').value = s.enabled ? 'true' : 'false';
  const p = document.getElementById('preview');
  p.src = s.imageUrlAbsolute || s.imageUrl; p.style.display = 'block';
  document.getElementById('f_image').required = false;
  document.getElementById('f_image').value = '';
  document.getElementById('dlg').showModal();
}
async function submitForm(e) {
  e.preventDefault();
  const fd = new FormData();
  fd.append('title', document.getElementById('f_title').value);
  fd.append('desc', document.getElementById('f_desc').value);
  fd.append('tag', document.getElementById('f_tag').value);
  fd.append('region', document.getElementById('f_region').value);
  fd.append('sortOrder', document.getElementById('f_sort').value);
  fd.append('enabled', document.getElementById('f_enabled').value);
  const img = document.getElementById('f_image').files[0];
  if (img) fd.append('image', img);
  const url = editing ? `${API}/${editing}` : API;
  const method = editing ? 'PUT' : 'POST';
  const res = await fetch(url, { method, body: fd });
  if (res.ok) { document.getElementById('dlg').close(); load(); }
  else { const err = await res.json().catch(()=>({})); alert('保存失败: ' + (err.error || res.status)); }
  return false;
}
async function del(id, title) {
  if (!confirm('确认删除场景「' + title + '」？图片也会从 MinIO 删除。')) return;
  const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
  if (res.ok) load(); else alert('删除失败');
}
document.getElementById('filterRegion').addEventListener('change', load);
load();
</script>
</body>
</html>
