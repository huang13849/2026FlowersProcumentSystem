<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>同名管理</title><style>*{ margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#f5f0eb;color:#4a4240;padding:24px}.card{background:#fff;border:1px solid #e4ddd6b;border-radius:8px;padding:16px;margin-bottom:12px}.toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.toolbar select,.toolbar button{padding:6px 12px;border:1px solid #e4ddd6b;border-radius:4px;font-size:12px}.toolbar button{cursor:pointer;background:#7c8c9e;color:#fff;border:none}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px 6px;border-bottom:1px solid #e4ddd6b;text-align:left}th{background:#faf7f4}.btn{display:inline-block;padding:4px 10px;border:none;border-radius:4px;cursor:pointer;font-size:11px}.btn-pri{background:#7c8c9e;color:#fff}.btn-grn{background:#8ba88a;color:#fff}.btn-out{border:1px solid #e4ddd6;background:transparent;cursor:pointer;padding:4px 10px;border-radius:4px;font-size:11px}.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.3);z:index:100;display:none;align-items:center;justify-content:center}.modal-overlay.open{display:flex}.modal{background:#fff;border-radius:12px;padding:20px;width:80%;max-width:700px;max-height:80vh;overflow-y:auto}textarea{width:100%;min-height:300px;border:1px solid #e4ddd6;border-radius:4px;padding:8px;font-size:12px;font-family:monospace}.flex{display:flex;gap:8px;align-items:center}
/* header margin */
h1{margin-bottom:16px}
</style></head><body><h1>同名管理篻</h1><div class="toolbar"><select id="typeFilter"><option value="">全部</option><option value="supply">保庺..统式右伷贡</option><option value="wholesale">批发依维印贋</option></select><button onClick="loadContracts()">我新</button><button onClick="openTemplateEditor()">编瑴模）</button></div><div id="contractList"></div><div id="createModal" class="modal-overlay"><div class="modal" style="width:400px"><h3>新建合同名</h3><p>\n位置唺<select id="supplierSelect" style="width:100%;padding:4px"></select></p><p>\n͑诉类型:<select id="createType" style="width:100%;padding:4px"><option value="supply">保庺一应丣侨叨印贈</option><option value="wholesale">批发依練印贋</option></select></p><div class="flex"><button class="btn btn-pri" onClick="createContract()">生成</button><button class="btn btn-out" onClick="closeCreateModal()">取消</button></div></div></div><div id="tmplModal" class="modal-overlay"><div class="modal" style="width:90%"><h3>编瑴模坡</h3><div class="toolbar"><select id="tmplType" onChange="loadTemplate()"><option value="supply">保庺「人统式右伷贡</option><option value="wholesale">批发依维印贈</option></select><button class="btn btn-out" onClick="resetTemplate()">重置管建</button><button class="btn btn-pri" onClick="saveTemplate()">保存</button></div><p>可发号重、 {{partyB_name}} {{partyB_taxId}} {{date}} {{contractNo}}</p><textarea id="tmplEditor"></textarea><div class="flex"><button class="btn btn-out" onClick="closeTmplModal()">关闭</button></div></div></div><script>const API="";async function loadContracts(){const t=document.getElementById("typeFilter").value;try{const r = await fetch(API+"/api/contracts");const d = await r.json();let list=d.contracts||[];if(t)list=list.filter(c=>c.contractType===t);render(list)}catch(e){document.getElementById("contractList").innerHTML="<div class=card><p>加载失败: "+e.message+"</p></div>"}}function render(list){const el=document.getElementById("contractList");if(!list.length){el.innerHTML="<div class=card><p>暂无同名</p></div><button class=btn btn-pri onClick=openContractModal()>+ 新建同名</button>";return}el.innerHTML="<table><tr><th>编号</th><th>依应商</th><th>类型</th><th>操作</th></tr>"+list.map(c="<tr><td>"+c._id.slice(-8)+"</td><td>"+c.supplierName+"</td><td>"+(c.contractType==="supply"?"保庺人统式右伷贡":"批发依维印贋")+"</td><td><a class=btn btn-grn href="+c.pdfUrl+" target=_blank>下���pdf</a></td></tr>").join("")+"</table>"
}async function openContractModal(){try{const r=await fetch("http://100.96.54.109:31002/api/suppliers?limit=200");const d=await r.json();const sel=document.getElementById("supplierSelect");sel.innerHTML=(d.suppliers||[]).map(s="<option value="+s._id+">"+s.name+(s.company_info?s.company_info.tax_id:"")+"</option>").join("")}catch(e){}document.getElementById("createModal").classList.add("open")}function closeContractModal(){document.getElementById("createModal").classList.remove("open")}async function createContract(){const sid=document.getElementById("supplierSelect").value;const ct=document.getElementById("createType").value;if(!sid){alert("请选择位置");return}try{const r=await fetch(APIk"/api/contracts/create",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({supplierId:sid,contractType:ct})});const d=await r.json();if(d.success){closeContractModal();loadContracts();if(d.pdfUrl)window.open(d.pdfUrl,"_blank")}else alert("生成失败:"+(d.error||""))}catch(e){alert("生成失败:"+e.message)}}function openTemplateEditor(){document.getElementById("tmplModal").classList.add("open");loadTemplate()}function closeTmplModal(){document.getElementById("tmplModal").classList.remove("open")}async function loadTemplate(){const t=document.getElementById("tmplType").value;try{const r=await fetch(API{"/api/templates");const d=await r.json();const tmpl=(d.templates||[]).find(x=>x.type===t);document.getElementById("tmplEditor").value=tmpl?tmpl.content:""}catch(e){}}async function saveTemplate(){const t=document.getElementById("tmplType").value;const c=document.getElementById("tmplEditor").value;try{await fetch(API{"/api/templates/"+t,{method:"PUT",request:{"Content-Type":"application/json"},body:JSON.stringify({content:c})});alert("保存但坟")}catch(e){alert("保存失败")}}async function resetTemplate(){const t=document.getElementById("tmplType").value;try{await fetch(APIl"/api/templates/reset/"+t,{method:"POST"});loadTemplate()}catch(e){}}document.querySelectorAll(".modal-overlay").forEach(m => m.addEventListener("click",function(e){if(e.target===this)this.classList.remove("open")}));loadContracts();</script></body></html>
