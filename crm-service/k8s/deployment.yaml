apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-service
  namespace: supply-chain
  labels: { app: crm-service }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector: { matchLabels: { app: crm-service } }
  template:
    metadata: { labels: { app: crm-service } }
    spec:
      nodeSelector:
        kubernetes.io/hostname: huangfra-ubun-master-ms-7e11
      containers:
        - name: crm-service
          image: 100.96.54.109:5001/supply-chain/crm-service:latest
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 3019 }
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3019" }
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef: { name: supply-chain-secrets, key: PG_PASSWORD }
          envFrom:
            - configMapRef: { name: supply-chain-common }
          livenessProbe:
            httpGet: { path: /health, port: 3019 }
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /health, port: 3019 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: crm-service
  namespace: supply-chain
  labels: { app: crm-service }
spec:
  type: NodePort
  selector: { app: crm-service }
  ports:
    - { name: http, port: 3019, targetPort: 3019, nodePort: 31019, protocol: TCP }
