<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI 智能助手 - 花卉供应链 v2.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Source Han Sans","Noto Sans SC",-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}
body{background:#F0F0F3;color:#4A4857;min-height:100vh}
.topbar{background:#B0B0BD;border-bottom:1px solid #D5D4D9;padding:12px 24px;display:flex;align-items:center;gap:12px}
.topbar h1{font-size:15px;font-weight:600;color:#4A4857}
.topbar .nav{display:flex;gap:8px;margin-left:auto}
.topbar .nav a{color:#8E8C97;text-decoration:none;font-size:12px;padding:4px 10px;border-radius:6px;transition:all 0.2s}
.topbar .nav a:hover{background:rgba(255,255,255,0.35);color:#4A4857}
.container{max-width:1200px;margin:0 auto;padding:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:18px}
.card{background:#E3E2E6;border-radius:12px;padding:18px;cursor:pointer;transition:all 0.3s;border:1px solid transparent}
.card:hover{background:#D7D6DA;box-shadow:0 4px 16px rgba(0,0,0,0.06);border-color:#CAC7CD;transform:translateY(-2px)}
.card .icon{font-size:24px;margin-bottom:6px}
.card h3{font-size:13px;font-weight:600;color:#4A4857;margin-bottom:2px}
.card p{font-size:12px;color:#8E8C97;line-height:1.4}
.card .badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;margin-top:4px}
.panel{background:#E3E2E6;border-radius:12px;padding:20px;display:none;margin-bottom:16px;animation:fadeUp 0.3s ease-out}
.panel.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.panel h2{font-size:15px;font-weight:600;color:#4A4857;margin-bottom:12px}
.panel textarea,.panel input[type=text]{width:100%;padding:8px 10px;background:#F0F0F3;border:1px solid #D5D4D9;border-radius:6px;font-size:13px;margin-bottom:10px;color:#4A4857;font-family:inherit;transition:border 0.2s}
.panel textarea::placeholder,.panel input::placeholder{color:#9A98A0}
.panel textarea:focus,.panel input:focus{outline:none;border-color:#A29FA5;background:#EBEAEE}
.panel textarea{min-height:72px;resize:vertical}
.row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.btn{padding:7px 18px;background:#A29FA5;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;transition:all 0.25s}
.btn:hover{background:#8E8C97;transform:translateY(-1px)}
.btn:disabled{background:#C5C4CB;cursor:not-allowed;transform:none}
.result{padding:12px;background:#F0F0F3;border-radius:6px;margin-top:10px;font-size:13px;line-height:1.6;display:none;border:1px solid #D5D4D9;max-height:500px;overflow-y:auto}
.result.show{display:block}
.result .label{font-weight:600;color:#8E8C97;margin-bottom:4px}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid #D5D4D9;border-top-color:#8E8C97;border-radius:50%;animation:spin 1s linear infinite;margin-right:6px;vertical-align:middle}
.upload-area{border:2px dashed #C5C4CB;border-radius:8px;padding:24px;text-align:center;cursor:pointer;margin-bottom:10px;transition:all 0.2s;background:rgba(240,240,243,0.5)}
.upload-area:hover{border-color:#A29FA5;background:rgba(240,240,243,0.8)}
.upload-area.has-image{border-color:#A8C5B6;padding:8px}
.upload-area img{max-width:180px;max-height:180px;border-radius:4px}
.json-view{background:#EBEAEE;border-radius:6px;padding:10px;font-size:12px;line-height:1.5;overflow-x:auto;border:1px solid #D5D4D9}
body::before{content:"";position:fixed;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23000000' fill-opacity='0.012'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");pointer-events:none;z-index:-1}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#D5D4D9;border-radius:2px}
</style></head>
<body>
<div class="topbar">
  <span style="font-size:18px">🌸</span>
  <h1>AI 智能助手</h1>
  <div class="nav"><a href="/">← 返回仪表盘</a></div>
</div>
<div class="container">
  <div class="cards">
    <div class="card" onclick="showPanel(0)"><div class="icon">🔍</div><h3>AI 识别植物</h3><p>上传图片，AI自动识别品种与分类</p><span class="badge" style="background:rgba(200,192,208,0.3);color:#6F6D73">视觉识别</span></div>
    <div class="card" onclick="showPanel(1)"><div class="icon">🏷️</div><h3>AI 生成 SKU</h3><p>智能生成SKU编码与商品编号</p><span class="badge" style="background:rgba(181,196,188,0.3);color:#6F6D73">编码生成</span></div>
    <div class="card" onclick="showPanel(2)"><div class="icon">✍️</div><h3>AI 营销文案</h3><p>自动生成标题、卖点与SEO标签</p><span class="badge" style="background:rgba(213,206,196,0.3);color:#6F6D73">文案创作</span></div>
    <div class="card" onclick="showPanel(3)"><div class="icon">✅</div><h3>AI 商品审核</h3><p>检查信息完整性，上架建议</p><span class="badge" style="background:rgba(201,184,192,0.3);color:#6F6D73">质检审核</span></div>
  </div>
  <div class="panel" id="panel0"><h2>🔍 植物识别</h2>
    <div class="upload-area" id="uploadArea0" onclick="document.getElementById('plantImage').click()">
      <div id="uploadPlaceholder0">📸 点击上传植物图片<br><span style="font-size:11px;color:#9A98A0">JPG / PNG / GIF ≤20MB</span></div>
      <img id="preview0" style="display:none;max-width:180px;border-radius:4px"/>
    </div>
    <input type="file" id="plantImage" accept="image/*" style="display:none" onchange="previewImage(this,0)"/>
    <button class="btn" id="identifyBtn" onclick="identifyPlant()">🔍 开始识别</button>
    <div class="result" id="identifyResult"></div>
  </div>
  <div class="panel" id="panel1"><h2>🏷️ 生成 SKU</h2>
    <div class="row"><input type="text" id="skuFlowerName" placeholder="花卉名称"/><input type="text" id="skuCategory" placeholder="分类"/></div>
    <div class="row"><input type="text" id="skuSeller" placeholder="商家名称"/><input type="text" id="skuTitle" placeholder="商品标题"/></div>
    <button class="btn" onclick="generateSKU()">🏷️ 生成</button>
    <div class="result" id="skuResult"></div>
  </div>
  <div class="panel" id="panel2"><h2>✍️ 营销文案</h2>
    <div class="row"><input type="text" id="copyTitle" placeholder="商品名称"/><input type="text" id="copyFlowerName" placeholder="花卉品种"/></div>
    <div class="row"><input type="text" id="copyCategory" placeholder="分类"/><input type="text" id="copySeller" placeholder="商家"/></div>
    <div class="row"><input type="text" id="copyPrice" placeholder="售价"/><input type="text" id="copyOrigin" placeholder="产地"/></div>
    <textarea id="copyExtra" placeholder="额外信息：花语、养护等"></textarea>
    <button class="btn" onclick="generateCopy()">✍️ 生成</button>
    <div class="result" id="copyResult"></div>
  </div>
  <div class="panel" id="panel3"><h2>✅ 上架审核</h2>
    <p style="font-size:12px;color:#8E8C97;margin:0 0 10px">填写商品信息，AI检查完整性和合规性</p>
    <div class="row"><input type="text" id="reviewTitle" placeholder="商品标题"/><input type="text" id="reviewFlowerName" placeholder="花卉名称"/></div>
    <div class="row"><input type="text" id="reviewCategory" placeholder="分类"/><input type="text" id="reviewSeller" placeholder="商家"/></div>
    <div class="row"><input type="text" id="reviewPrice" placeholder="售价"/><input type="text" id="reviewCost" placeholder="成本价"/></div>
    <div class="row"><input type="text" id="reviewStock" placeholder="库存"/><input type="text" id="reviewOrigin" placeholder="产地"/></div>
    <button class="btn" onclick="reviewProduct()">✅ 审核</button>
    <div class="result" id="reviewResult"></div>
  </div>
</div>
<script>
const AI_API="http://100.96.54.109:3003/api/ai";
function showPanel(i){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById('panel'+i).classList.add('active');document.getElementById('panel'+i).scrollIntoView({behavior:'smooth',block:'start'})}
function previewImage(i){var f=i.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){document.getElementById('preview0').src=e.target.result;document.getElementById('preview0').style.display='block';document.getElementById('uploadPlaceholder0').style.display='none';document.getElementById('uploadArea0').classList.add('has-image')};r.readAsDataURL(f)}
function loadBtn(id,loading){var b=document.getElementById(id);b.disabled=loading;b.innerHTML=loading?'<span class="spinner"></span>处理中...':b.dataset.orig;if(!b.dataset.orig)b.dataset.orig=b.innerHTML}
function showRes(id,data,err){var el=document.getElementById(id);el.classList.add('show');if(err){el.innerHTML='<div class="label">❌</div><div style="color:#C9A8A8">'+data+'</div>';return}
var h='<div class="json-view">';function o(obj,indent){for(const[k,v]of Object.entries(obj)){if(typeof v==='object'&&v!==null&&!Array.isArray(v)){h+='  '.repeat(indent)+'"'+k+'": {<br>';o(v,indent+1);h+='  '.repeat(indent)+'}<br>'}else{var val=Array.isArray(v)?'['+v.map(x=>'"'+x+'"').join(', ')+']':(typeof v==='string'?'"'+v+'"':v);h+='  '.repeat(indent)+'"'+k+'": '+(typeof v==='string'?val:val)+'<br>'}}}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')};o(data,1);h+='</div>';el.innerHTML=h}
async function identifyPlant(){var fi=document.getElementById('plantImage');if(!fi.files[0])return alert('请先上传图片');loadBtn('identifyBtn',true);showRes('identifyResult',{status:'分析中...'});try{var fd=new FormData();fd.append('image',fi.files[0]);var r=await fetch(AI_API+'/identify-plant',{method:'POST',body:fd});var d=await r.json();if(d.error){showRes('identifyResult',d.error,true);return}showRes('identifyResult',d)}catch(e){showRes('identifyResult',e.message,true)}loadBtn('identifyBtn',false)}
async function generateSKU(){var body={flowerName:document.getElementById('skuFlowerName').value,category:document.getElementById('skuCategory').value,sellerName:document.getElementById('skuSeller').value,title:document.getElementById('skuTitle').value};if(!body.flowerName&&!body.title)return alert('请填写花卉名称或标题');loadBtn('identifyBtn',true);showRes('skuResult',{status:'生成中...'});try{var r=await fetch(AI_API+'/generate-sku',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});var d=await r.json();if(d.error){showRes('skuResult',d.error,true);return}showRes('skuResult',d)}catch(e){showRes('skuResult',e.message,true)}loadBtn('identifyBtn',false)}
async function generateCopy(){var body={title:document.getElementById('copyTitle').value,flowerName:document.getElementById('copyFlowerName').value,category:document.getElementById('copyCategory').value,sellerName:document.getElementById('copySeller').value,sellPrice:document.getElementById('copyPrice').value,origin:document.getElementById('copyOrigin').value,description:document.getElementById('copyExtra').value};if(!body.title&&!body.flowerName)return alert('请填写商品名称或品种');loadBtn('identifyBtn',true);showRes('copyResult',{status:'生成中...'});try{var r=await fetch(AI_API+'/generate-copy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});var d=await r.json();if(d.error){showRes('copyResult',d.error,true);return}showRes('copyResult',d)}catch(e){showRes('copyResult',e.message,true)}loadBtn('identifyBtn',false)}
async function reviewProduct(){var body={title:document.getElementById('reviewTitle').value,flowerName:document.getElementById('reviewFlowerName').value,category:document.getElementById('reviewCategory').value,sellerName:document.getElementById('reviewSeller').value,sellPrice:document.getElementById('reviewPrice').value,costPrice:document.getElementById('reviewCost').value,stock:document.getElementById('reviewStock').value,origin:document.getElementById('reviewOrigin').value};if(!body.title)return alert('请填写商品标题');loadBtn('identifyBtn',true);showRes('reviewResult',{status:'审核中...'});try{var r=await fetch(AI_API+'/auto-list-review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});var d=await r.json();if(d.error){showRes('reviewResult',d.error,true);return}showRes('reviewResult',d)}catch(e){showRes('reviewResult',e.message,true)}loadBtn('identifyBtn',false)}
</script></body></html>
