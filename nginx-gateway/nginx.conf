            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # order-service -> k3s NodePort 31008 (service port 3008)
    upstream order-service {
        server 100.96.54.109:31008;
    }
    server {
        listen 3008;
        location / {
            proxy_pass http://order-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # api-gateway -> k3s NodePort 31007 (service port 3007)
    upstream api-gateway {
        server 100.96.54.109:31007;
    }
    server {
        listen 3007;
        location / {
            proxy_pass http://api-gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # scene-service -> k3s NodePort 31012 (service port 3012)
    upstream scene-service {
        server 100.96.54.109:31012;
    }
    server {
        listen 3012;
        location / {
            proxy_pass http://scene-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # contract-service -> k3s NodePort 31006 (service port 3006)
    upstream contract-service {
        server 100.96.54.109:31006;
    }
    server {
        listen 3006;
        location / {
            proxy_pass http://contract-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}
