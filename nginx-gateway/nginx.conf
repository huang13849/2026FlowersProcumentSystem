events {
    worker_connections 1024;
}
http {
    include       /etc/nginx/mime.types;
    default_type  text/html;

    # ===== 主入口：供应链管理平台 =====
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html ai.html;
            try_files $uri $uri/ /index.html /ai.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires -1;
        }

        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|pdf)$ {
            root /usr/share/nginx/html;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        location /api/products { proxy_pass http://host.docker.internal:3001; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /api/suppliers { proxy_pass http://host.docker.internal:3002; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /api/shops { proxy_pass http://host.docker.internal:3004; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /api/upload { proxy_pass http://host.docker.internal:3002; proxy_http_version 1.1; proxy_set_header Host $host; client_max_body_size 100m; }
        location /api/health { proxy_pass http://host.docker.internal:3001; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /api/raw-flowers { proxy_pass http://host.docker.internal:3009; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /api/prices { proxy_pass http://host.docker.internal:3009; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /api/publish { proxy_pass http://host.docker.internal:3005; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /api/ai { proxy_pass http://host.docker.internal:3003; proxy_http_version 1.1; proxy_set_header Host $host; client_max_body_size 30m; proxy_read_timeout 180s; }
        location /api/orders { proxy_pass http://host.docker.internal:3008; proxy_http_version 1.1; proxy_set_header Host $host; }

        location = /system-test { return 301 /system-test/; }
        location /system-test/ {
            proxy_pass http://100.67.179.28:3020/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
        }
        location /publish { alias /usr/share/nginx/html; try_files /publish.html =404; }
        location /price { return 301 /price/; }
        location /assets/ { proxy_pass http://host.docker.internal:3009/assets/; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /price/ { proxy_pass http://host.docker.internal:3009/; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /order/ {
            proxy_pass http://host.docker.internal:3008/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OpenMetadata 数据目录管理
        location /metadata/ {
            proxy_pass http://100.109.206.83:8585/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 120s;
            proxy_buffering off;
        }

        location /ai { alias /usr/share/nginx/html; try_files /ai.html =404; }
    }

    # ===== 花伴入口：Next.js 前端 + API 代理 =====
    server {
        listen 8089;
        server_name localhost;

        # Next.js 前端
        location / {
            proxy_pass http://100.76.15.64:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Next.js 静态资源
        location /_next/static {
            proxy_pass http://100.76.15.64:3000/_next/static;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # 花伴 API
        location /api/ {
            proxy_pass http://100.76.15.64:3010/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }
    }

    # Prometheus stub_status
    server {
        listen 8090;
        server_name localhost;
        location /stub_status { stub_status; allow all; }
    }
}
