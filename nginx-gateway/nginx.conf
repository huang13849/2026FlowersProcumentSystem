events {
    worker_connections 1024;
}
http {
    include       /etc/nginx/mime.types;
    default_type  text/html;

    # ===== 主入口：供应链管理平台 =====
    server {
        listen 80;
        server_name localhost;
        # openmetadata-root-fallback: OpenMetadata sometimes emits SPA routes at root without /metadata prefix
        location ~* (%20|%2C|%22|%2F) {
            proxy_pass http://100.96.54.109:30858;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }


        # openmetadata-shrubs-fallback: root-level OpenMetadata entity title route
        location ^~ /shrubs {
            proxy_pass http://100.96.54.109:30858;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html ai.html;
            try_files $uri $uri/ /index.html /ai.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires -1;
        }

        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|pdf)$ {
            root /usr/share/nginx/html;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ---- 监控入口 Grafana (K3s NodePort) ----
        location /monitor/ {
            proxy_pass http://100.96.54.109:30300/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        location /api/products { proxy_pass http://100.96.54.109:31001; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /api/images { proxy_pass http://100.96.54.109:31001; proxy_http_version 1.1; proxy_set_header Host $host; client_max_body_size 12m; }
        location /api/suppliers { proxy_pass http://100.96.54.109:31002; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /api/shops { proxy_pass http://100.96.54.109:31004; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /api/upload { proxy_pass http://100.96.54.109:31002; proxy_http_version 1.1; proxy_set_header Host $host; client_max_body_size 100m; }
        location /api/health { proxy_pass http://100.96.54.109:31001; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /api/raw-flowers { proxy_pass http://100.96.54.109:31009; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /api/prices { proxy_pass http://100.96.54.109:31009; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /api/publish { proxy_pass http://100.96.54.109:31005; proxy_http_version 1.1; proxy_set_header Host $host; client_max_body_size 100m; proxy_read_timeout 180s; }
        location /api/ai { proxy_pass http://100.96.54.109:31003; proxy_http_version 1.1; proxy_set_header Host $host; client_max_body_size 30m; proxy_read_timeout 180s; }
        location /api/orders { proxy_pass http://100.96.54.109:31008; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /api/scenes { proxy_pass http://100.96.54.109:31012; proxy_http_version 1.1; proxy_set_header Host $host; client_max_body_size 20m; }
        location /api/mongo { proxy_pass http://100.96.54.109:31007/api/mongo; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header x-api-key "c5c0986a64a5253c7eef1b099ea3ba8fb76ec0bcf2418344"; }
        location /api/zitadel { proxy_pass http://100.96.54.109:31007/api/zitadel; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header x-api-key "c5c0986a64a5253c7eef1b099ea3ba8fb76ec0bcf2418344"; }
        location /api/sync {
            proxy_pass http://100.96.54.109:30253;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
        location /api/tags { proxy_pass http://100.96.54.109:31007/api/tags; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header x-api-key "c5c0986a64a5253c7eef1b099ea3ba8fb76ec0bcf2418344"; }
        location /api/users { proxy_pass http://100.96.54.109:31007/api/users; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header x-api-key "c5c0986a64a5253c7eef1b099ea3ba8fb76ec0bcf2418344"; proxy_read_timeout 60s; }
        location /api/crm { proxy_pass http://100.96.54.109:31007/api/crm; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header x-api-key "c5c0986a64a5253c7eef1b099ea3ba8fb76ec0bcf2418344"; }
        location /api/school-face/ { proxy_pass http://100.96.54.109:31031/api/school/; proxy_http_version 1.1; proxy_set_header Host $host; }

        location = /system-test { return 301 /system-test/; }
        location /system-test/ {
            proxy_pass http://100.96.54.109:30320/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
        }
        location /publish { proxy_pass http://100.96.54.109:31005/; proxy_http_version 1.1; proxy_set_header Host $host; client_max_body_size 100m; proxy_read_timeout 180s; }
        location /price { return 301 /price/; }
        location ^~ /assets/ { proxy_pass http://100.96.54.109:30858/assets/; proxy_http_version 1.1; proxy_set_header Host $host; }
        # openmetadata-images
        location ^~ /images/ { proxy_pass http://100.96.54.109:30858/images/; proxy_http_version 1.1; proxy_set_header Host $host; }
        location ^~ /price-assets/ { proxy_pass http://100.96.54.109:31009/assets/; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /price/ {
            proxy_pass http://100.96.54.109:31009/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Accept-Encoding "";
            sub_filter_once off;
            sub_filter '"/assets/' '"/price-assets/';
        }
        location /order/ {
            proxy_pass http://100.96.54.109:31020/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 场景案例管理
        location = /scenes { return 301 /scenes/; }
        location /scenes/ {
            proxy_pass http://100.96.54.109:31012/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            client_max_body_size 20m;
        }

        # OpenMetadata 数据目录管理
        location /metadata/ {
            proxy_pass http://100.96.54.109:30858/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 120s;
            proxy_buffering off;
        }

        
        # ===== 统一控制台 (console-nav-service) =====
        location = /console { return 301 /console/; }
        location /console/ { proxy_pass http://100.96.54.109:31040/; proxy_http_version 1.1; proxy_set_header Host $host; }
        location = /nav.js  { proxy_pass http://100.96.54.109:31040/nav.js; proxy_http_version 1.1; proxy_set_header Host $host; }
        location = /nav.css { proxy_pass http://100.96.54.109:31040/nav.css; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /api/nav/  { proxy_pass http://100.96.54.109:31040/api/nav/; proxy_http_version 1.1; proxy_set_header Host $host; }
        location /users { alias /usr/share/nginx/html; try_files /users.html =404; }
        location /tags-admin { alias /usr/share/nginx/html; try_files /tags-admin.html =404; }
        location /ai { alias /usr/share/nginx/html; try_files /ai.html =404; }


        # ===== OpenMetadata (root-level SPA fallback:/shrubs 等表页面) =====
        location ^~ /api/v1/ {
            proxy_pass http://100.96.54.109:30858;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
        location ^~ /v1/ {
            proxy_pass http://100.96.54.109:30858;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
        }
        location ^~ /favicons/ {
            proxy_pass http://100.96.54.109:30858;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location = /favicon.png {
            proxy_pass http://100.96.54.109:30858;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location = /manifest.json {
            proxy_pass http://100.96.54.109:30858;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location ^~ /locales/ {
            proxy_pass http://100.96.54.109:30858;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location ^~ /fonts/ {
            proxy_pass http://100.96.54.109:30858;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        # OM SPA 实体路由
        location ~* ^/(table|database|databaseSchema|dashboard|topic|pipeline|mlmodel|container|glossary|glossaryTerm|tags|domain|dataProduct|entity|service|teams|bots|explore|classification|persona|storedProcedure|apiCollection|apiEndpoint|searchIndex|test-case|test-suite|data-quality|incident-manager|activity_feed|my-data|following|logs|governance|analytics|customize|profiler-dashboard|signin|signup)(/.*)?$ {
            proxy_pass http://100.96.54.109:30858;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ===== K3s 服务反向代理到 Traefik =====
        location ~ ^/(dashboard|grafana|jenkins|prometheus|alertmanager|longhorn)(/.*)?$ {
            proxy_pass http://10.43.238.199:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }

    # ===== 花伴入口：Next.js 前端 + API 代理 =====
    server {
        listen 8089;
        server_name localhost;

        # Next.js 前端
        location / {
            proxy_pass http://100.96.54.109:31000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Next.js 静态资源
        location /_next/static {
            proxy_pass http://100.96.54.109:31000/_next/static;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # 花伴 API
        location /api/ {
            proxy_pass http://100.96.54.109:31010/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }
    }

    # ===== 北京花卉订单监控 =====
    server {
        listen 80;
        server_name order.beijingflower.com;

        location / {
            proxy_pass http://100.96.54.109:31456;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }

    # Prometheus stub_status
    server {
        listen 8090;
        server_name localhost;
        location /stub_status { stub_status; allow all; }
    }
}
