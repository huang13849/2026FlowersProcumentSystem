events {
    worker_connections 1024;
}
http {
    include       /etc/nginx/mime.types;
    default_type  text/html;

    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html ai.html;
            try_files $uri $uri/ /index.html /ai.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires -1;
        }

        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|pdf)$ {
            root /usr/share/nginx/html;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        location /api/products {
            proxy_pass http://host.docker.internal:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /api/suppliers {
            proxy_pass http://host.docker.internal:3002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /api/shops {
            proxy_pass http://host.docker.internal:3004;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /api/upload {
            proxy_pass http://host.docker.internal:3002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            client_max_body_size 100m;
        }

        location /api/health {
            proxy_pass http://host.docker.internal:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /api/raw-flowers {
            proxy_pass http://host.docker.internal:3009;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /api/prices {
            proxy_pass http://host.docker.internal:3009;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /api/publish {
            proxy_pass http://host.docker.internal:3005;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /api/ai {
            proxy_pass http://host.docker.internal:3003;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            client_max_body_size 30m;
            proxy_read_timeout 180s;
        }

        location /publish {
            alias /usr/share/nginx/html;
            try_files /publish.html =404;
        }

        location /price {
            return 301 /price/;
        }

        location /assets/ {
            proxy_pass http://host.docker.internal:3009/assets/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /price/ {
            proxy_pass http://host.docker.internal:3009/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /ai {
            alias /usr/share/nginx/html;
            try_files /ai.html =404;
        }
    }

    # Prometheus stub_status endpoint
    server {
        listen 8090;
        server_name localhost;
        location /stub_status {
            stub_status;
            allow all;
        }
    }
}
