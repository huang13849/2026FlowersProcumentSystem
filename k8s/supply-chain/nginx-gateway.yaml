apiVersion: v1
kind: Namespace
metadata:
  name: supply-chain
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gateway
  namespace: supply-chain
  labels:
    app: nginx-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate     # hostPort 只允许一个 pod
  selector:
    matchLabels:
      app: nginx-gateway
  template:
    metadata:
      labels:
        app: nginx-gateway
    spec:
      nodeSelector:
        kubernetes.io/hostname: huangfra-ubun-master-ms-7e11
      containers:
      - name: nginx
        image: 100.76.15.64:5001/supply-chain/nginx-gateway:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 80
          hostPort: 8088
          protocol: TCP
        - name: hb
          containerPort: 8089
          hostPort: 8089
          protocol: TCP
        - name: stub
          containerPort: 8090
          hostPort: 8090
          protocol: TCP
        readinessProbe:
          httpGet: { path: /users, port: 80 }
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /users, port: 80 }
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests: { cpu: 50m, memory: 32Mi }
          limits:   { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway
  namespace: supply-chain
spec:
  type: ClusterIP
  selector:
    app: nginx-gateway
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: hb
    port: 8089
    targetPort: 8089
