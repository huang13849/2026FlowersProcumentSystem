apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: supply-chain
  labels: { app: ai-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ai-service }
  template:
    metadata:
      labels: { app: ai-service }
    spec:
      nodeSelector:
        kubernetes.io/hostname: huangfra-ubun-master-ms-7e11
      containers:
      - name: ai-service
        image: 100.76.15.64:5001/supply-chain/ai-service:latest
        imagePullPolicy: Always
        env:
        - { name: PORT, value: "3003" }
        - { name: AI_MODEL_TEXT, value: "qwen2.5:7b" }
        - { name: AI_MODEL_VISION, value: "llava:7b" }
        - { name: OLLAMA_BASE_URL, value: "http://100.96.54.109:11434" }
        ports:
        - containerPort: 3003
        readinessProbe:
          tcpSocket: { port: 3003 }
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits:   { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: supply-chain
spec:
  type: NodePort
  selector: { app: ai-service }
  ports:
  - port: 3003
    targetPort: 3003
    nodePort: 31003
