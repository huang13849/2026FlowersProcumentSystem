apiVersion: v1
kind: Service
metadata:
  name: product-web-service
  namespace: supply-chain
  labels: { app: product-web-service, tier: web }
spec:
  type: NodePort
  selector: { app: product-web-service }
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 31001
    protocol: TCP
