apiVersion: v1
kind: Service
metadata:
  name: product-api-service
  namespace: supply-chain
  labels: { app: product-api-service, tier: api }
spec:
  type: NodePort
  selector: { app: product-api-service }
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    nodePort: 31014
    protocol: TCP
