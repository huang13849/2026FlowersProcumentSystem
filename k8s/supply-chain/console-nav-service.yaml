apiVersion: apps/v1
kind: Deployment
metadata:
  name: console-nav-service
  namespace: supply-chain
spec:
  replicas: 1
  selector: { matchLabels: { app: console-nav-service } }
  template:
    metadata: { labels: { app: console-nav-service } }
    spec:
      nodeName: huangfra-ubun-master-ms-7e11
      containers:
      - name: web
        image: 100.76.15.64:5001/supply-chain/console-nav-service:latest
        imagePullPolicy: Always
        ports: [{ containerPort: 3020 }]
        resources: { requests: { memory: 32Mi, cpu: 10m }, limits: { memory: 128Mi, cpu: 200m } }
        readinessProbe: { httpGet: { path: /healthz, port: 3020 }, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata:
  name: console-nav-service
  namespace: supply-chain
spec:
  type: NodePort
  selector: { app: console-nav-service }
  ports:
  - port: 3020
    targetPort: 3020
    nodePort: 31040
