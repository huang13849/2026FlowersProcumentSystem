apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: supply-chain
  labels:
    app: order-service
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: order-service } }
  template:
    metadata: { labels: { app: order-service } }
    spec:
      nodeName: xsyysj
      containers:
        - name: order-service
          image: 100.76.15.64:5001/supply-chain/order-service:latest
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 3008 }
          envFrom:
            - configMapRef: { name: supply-chain-common }
            - secretRef: { name: supply-chain-secrets }
          env:
            - { name: NODE_ENV, value: "production" }
            - { name: PORT, value: "3008" }
            - { name: PRODUCT_SERVICE_URL, value: "http://product-api-service.supply-chain.svc.cluster.local:3000" }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 1000m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /api/health, port: 3008 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 3008 }
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata: { name: order-service, namespace: supply-chain }
spec:
  type: NodePort
  selector: { app: order-service }
  ports:
    - { name: http, port: 3008, targetPort: 3008, nodePort: 31008 }