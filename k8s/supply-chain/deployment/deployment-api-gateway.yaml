apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: supply-chain
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      nodeSelector:
        kubernetes.io/hostname: huangfra-ubun-master-ms-7e11
      containers:
      - name: api-gateway
        image: 100.96.54.109:5001/supply-chain/api-gateway:latest
        imagePullPolicy: Always
        imagePullPolicy: Always
        ports:
        - containerPort: 3007
        envFrom:
        - configMapRef:
            name: supply-chain-common
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3007"
        - name: ZITADEL_PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: supply-chain-secrets
              key: ZITADEL_PG_PASSWORD
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: supply-chain-secrets
              key: PG_PASSWORD
        - name: ZITADEL_SYSTEM_KEY_PATH
          value: /system-key/systemuser.key
        - name: ZITADEL_URL
          value: http://zitadel.identity.svc.cluster.local:8080
        - name: ZITADEL_AUD
          value: http://id.horiculture.club:443
        volumeMounts:
        - name: zitadel-system-key
          mountPath: /system-key
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3007
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3007
          initialDelaySeconds: 3
          periodSeconds: 10
      volumes:
      - name: zitadel-system-key
        secret:
          secretName: zitadel-system-key
          items:
          - key: systemuser.key
            path: systemuser.key
