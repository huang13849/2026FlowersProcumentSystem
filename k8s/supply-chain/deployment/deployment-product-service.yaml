apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: supply-chain
  labels:
    app: product-service
spec:
  replicas: 0
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      nodeSelector:
        kubernetes.io/hostname: huangfra-ubun-master-ms-7e11
      containers:
      - name: product-service
        image: 100.76.15.64:5001/supply-chain/product-service:latest
        imagePullPolicy: Always
        command: ["sh", "-lc", "cd /app/backend && node server.js"]
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: supply-chain-common
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: product-mongo-env
              key: MONGODB_URI
        - name: MONGODB_URI_FALLBACK
          valueFrom:
            secretKeyRef:
              name: product-mongo-env
              key: MONGODB_URI_FALLBACK
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 3
          periodSeconds: 10
