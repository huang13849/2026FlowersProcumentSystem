apiVersion: apps/v1
kind: Deployment
metadata:
  name: seller-binding-service
  namespace: supply-chain
  labels:
    app: seller-binding-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seller-binding-service
  template:
    metadata:
      labels:
        app: seller-binding-service
    spec:
      nodeSelector:
        kubernetes.io/hostname: huangfra-ubun-master-ms-7e11
      containers:
      - name: seller-binding-service
        image: 100.76.15.64:5001/supply-chain/seller-binding-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3013
        envFrom:
        - configMapRef:
            name: supply-chain-common
        - secretRef:
            name: supply-chain-secrets
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3013"
        - name: PRODUCT_SVC_URL
          value: "http://product-api-service.supply-chain.svc.cluster.local:3000"
        - name: NEW_ECOMMERCE_PG_DATABASE
          value: "new_ecommerce"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3013
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3013
          initialDelaySeconds: 3
          periodSeconds: 10
