apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-service
  namespace: supply-chain
  labels:
    app: shop-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop-service
  template:
    metadata:
      labels:
        app: shop-service
    spec:
      nodeSelector:
        kubernetes.io/hostname: huangfra-ubun-master-ms-7e11
      containers:
      - name: shop-service
        image: 100.76.15.64:5001/supply-chain/shop-service:latest
        imagePullPolicy: IfNotPresent
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3004
        envFrom:
        - configMapRef:
            name: supply-chain-common
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3004"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3004
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3004
          initialDelaySeconds: 3
          periodSeconds: 10
