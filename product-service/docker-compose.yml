services:
  product:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: product-service
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file: .env
    volumes:
      - /home/huangfra-ubun-master/picgo/uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e "require('http').get({host:'localhost',port:3000,path:'/api/health',timeout:5000},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))""]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
