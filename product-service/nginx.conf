server {
    listen 80;
    server_name _;

    # 静态资源
    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # 上游 backend（k8s ClusterIP）
    resolver kube-dns.kube-system.svc.cluster.local ipv6=off valid=30s;

    # /api/sync/* → flower-price-sync-api (NodePort 30253 -> service 3053)
    location /api/sync/ {
        proxy_pass http://flower-price-sync-api.supply-chain.svc.cluster.local:3053/api/sync/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # /api → product-api-service
    location /api/ {
        proxy_pass http://product-api-service.supply-chain.svc.cluster.local:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        client_max_body_size 100m;
    }

    # 商品图片直传/上传目录
    location /images/ {
        proxy_pass http://product-api-service.supply-chain.svc.cluster.local:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        client_max_body_size 100m;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 显式 static 缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
