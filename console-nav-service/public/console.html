<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>花卉采购管理平台 · 统一门户</title>
<link rel="stylesheet" href="/nav.css">
<style>
:root{--bg:#0a1020;--fg:#e8eaed;--muted:#9aa0b0;--card:rgba(17,26,46,.7);--border:rgba(255,255,255,.08)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,'SF Pro Text','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;overflow-x:hidden}
body::before{content:'';position:fixed;inset:-30%;z-index:0;background:
  radial-gradient(circle at 15% 20%,rgba(192,132,252,.28),transparent 40%),
  radial-gradient(circle at 80% 30%,rgba(244,114,182,.24),transparent 40%),
  radial-gradient(circle at 50% 80%,rgba(96,165,250,.24),transparent 45%);
  filter:blur(60px);animation:heroA 18s ease-in-out infinite alternate;pointer-events:none}
@keyframes heroA{0%{transform:translate(0,0) rotate(0deg)}100%{transform:translate(3%,-3%) rotate(6deg)}}
.wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:110px 28px 60px}
.hero h1{font-size:clamp(32px,4vw,52px);margin:0 0 12px;font-weight:800;letter-spacing:.5px;
  background:linear-gradient(135deg,#c084fc,#f472b6 40%,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:14px;margin:0 0 40px;max-width:640px;line-height:1.7}
.hero .kbd{display:inline-block;padding:2px 8px;border:1px solid rgba(255,255,255,.15);border-radius:6px;font-family:monospace;font-size:11px;color:#c084fc;margin:0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{position:relative;background:var(--card);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  border:1px solid var(--border);border-radius:20px;padding:24px 22px;text-decoration:none;color:var(--fg);
  transition:all .35s cubic-bezier(.16,1,.3,1);overflow:hidden;cursor:pointer;display:block}
.card::before{content:'';position:absolute;inset:0;background:var(--cg);opacity:0;transition:opacity .4s;z-index:0}
.card::after{content:'';position:absolute;inset:-1px;border-radius:20px;padding:1px;
  background:var(--cg);opacity:0;transition:opacity .4s;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;z-index:0}
.card:hover{transform:translateY(-6px) scale(1.02)}
.card:hover::before{opacity:.15}
.card:hover::after{opacity:.7}
.card > *{position:relative;z-index:1}
.icon{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--cg);box-shadow:0 12px 28px var(--cgl);margin-bottom:16px;transition:transform .3s}
.card:hover .icon{transform:rotate(-6deg) scale(1.08)}
.name{font-size:16px;font-weight:700;margin-bottom:6px;letter-spacing:.3px}
.desc{font-size:12px;color:var(--muted);margin:0;line-height:1.55}
.dot{position:absolute;top:20px;right:20px;width:8px;height:8px;border-radius:50%;background:#52c41a;box-shadow:0 0 10px rgba(82,196,26,.7);animation:blink 2.5s infinite}
.dot.down{background:#f5222d;box-shadow:0 0 10px rgba(245,34,45,.7)}
@keyframes blink{0%,100%{opacity:.7}50%{opacity:1}}
</style>
</head>
<body>
<script>window.__APPS = __APPS_JSON__;</script>
<script src="/nav.js" data-app="portal"></script>
<div class="wrap">
  <div class="hero">
    <h1>🌸 花卉采购管理平台</h1>
    <p>统一门户 · 微服务架构 · 一键切换所有管理系统。<br>
    快捷键 <span class="kbd">⌘</span><span class="kbd">K</span> 或 <span class="kbd">Ctrl</span><span class="kbd">K</span> 可随时唤出导航。</p>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
(function(){
  var APPS = window.__APPS;
  var descs = {
    products:'商品目录 · SKU · 上架 · 图片压缩',
    suppliers:'店铺入驻登记 · 资质审核 · 标签体系',
    shops:'经销商 · 门店 · 交易配置',
    users:'全部用户 · Zitadel 汇总 · 标签体系',
    architect:'系统架构图 · 数据流 · 服务依赖',
    maps:'供应商地图 · 场地 · 物流路线',
    metadata:'数据目录 · 元数据 · 血缘',
    monitor:'Grafana 看板 · Prometheus 指标'
  };
  var g = document.getElementById('grid');
  APPS.forEach(function(a){
    var c = document.createElement('a');
    c.className='card';
    c.style.setProperty('--cg', a.gradient);
    c.style.setProperty('--cgl', a.color+'55');
    c.href = a.href;
    c.innerHTML =
        '<span class="dot" data-h="'+a.id+'"></span>'
      + '<div class="icon">'+a.icon+'</div>'
      + '<div class="name">'+a.name+'</div>'
      + '<p class="desc">'+(descs[a.id]||'')+'</p>';
    g.appendChild(c);
  });
  fetch('/api/nav/health').then(function(r){return r.json()}).then(function(d){
    (d.data||[]).forEach(function(h){
      var dot = document.querySelector('.dot[data-h="'+h.id+'"]');
      if(dot && h.status!=='up') dot.classList.add('down');
    });
  }).catch(function(){});
})();
</script>
</body>
</html>
