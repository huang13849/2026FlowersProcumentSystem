function EditableCell({ value, onChange, type = 'text', options, displayRender = null }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(value);
  const ref = useRef(null);

  useEffect(() => { setVal(value); }, [value]);
  useEffect(() => { if (editing && ref.current) ref.current.focus(); }, [editing]);

  const confirm = () => { setEditing(false); if (val !== value) onChange(val); };
  const cancel = () => { setEditing(false); setVal(value); };

  if (type === 'select') {
    if (editing) return (
      <Select ref={ref} className="editable-cell-select" value={val} onChange={v => { setVal(v); setTimeout(() => { onChange(v); setEditing(false); }, 50); }}
        onBlur={() => setEditing(false)} options={options} size="small" style={{ width: '100%' }}
        open onDropdownVisibleChange={v => { if (!v) setEditing(false); }} />
    );
    return <span className="cell-display" onDoubleClick={() => setEditing(true)}>{displayRender ? displayRender() : (value ? <Tag color={typeColors[value] || 'default'}>{value}</Tag> : <span style={{color:'#bbb'}}>双击编辑</span>)}</span>;
  }

  if (editing) return <Input ref={ref} className="editable-cell-input" value={val || ''} onChange={e => setVal(e.target.value)}
    onPressEnter={confirm} onBlur={confirm} onKeyDown={e => { if (e.key === 'Escape') cancel(); }} size="small" />;
  return <span className="cell-display" onDoubleClick={() => setEditing(true)}>{value || <span style={{color:'#bbb'}}>-</span>}</span>;
}

function MoneyEditableCell({ value, onChange }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(value != null ? Number(value) : 0);
  const ref = useRef(null);

  useEffect(() => { setVal(value != null ? Number(value) : 0); }, [value]);
  useEffect(() => { if (editing && ref.current) ref.current.focus(); }, [editing]);

  const confirm = () => {
    setEditing(false);
    const next = Number(val || 0);
    if (next !== Number(value || 0)) onChange(next);
  };

  if (editing) return (
    <InputNumber ref={ref} value={val} precision={2} controls={false}
      prefix="¥" style={{ width: '100%' }} size="small"
      onChange={v => setVal(v)} onPressEnter={confirm} onBlur={confirm}
      onKeyDown={e => { if (e.key === 'Escape') { setEditing(false); setVal(value != null ? Number(value) : 0); } }} />
  );
  return (
    <span className="cell-display" onDoubleClick={() => setEditing(true)} style={{ textAlign: 'right', display: 'block' }}>
      ¥{Number(value || 0).toFixed(2)}
    </span>
  );
}


function PersonalTagEditor({ value, onChange }) {
  const [tags, setTags] = useState([]);
  const [inputVisible, setInputVisible] = useState(false);
  const [inputVal, setInputVal] = useState('');
  const inputRef = useRef(null);

  useEffect(() => {
    if (value && typeof value === 'string' && value.trim()) {
      setTags(value.split(',').map(t => t.trim()).filter(Boolean));
    } else {
      setTags([]);
    }
  }, [value]);

  useEffect(() => { if (inputVisible && inputRef.current) inputRef.current.focus(); }, [inputVisible]);

  const removeTag = (tag) => {
    const next = tags.filter(t => t !== tag);
    setTags(next);
    onChange(next.join(','));
  };

  const addTag = () => {
    if (inputVal.trim() && !tags.includes(inputVal.trim())) {
      const next = [...tags, inputVal.trim()];
      setTags(next);
      onChange(next.join(','));
    }
    setInputVal('');
    setInputVisible(false);
  };

  const tagColors = ['blue', 'geekblue', 'purple', 'magenta', 'volcano', 'gold', 'lime', 'green'];

  return (
    <div className="tag-list" onClick={e => e.stopPropagation()}>
      {tags.map((t, i) => (
        <Tag key={t} color={tagColors[i % tagColors.length]} closable onClose={() => removeTag(t)} style={{ margin: 0 }}>{t}</Tag>
      ))}
      {inputVisible ? (
        <Input ref={inputRef} className="tag-input" size="small" value={inputVal}
          onChange={e => setInputVal(e.target.value)} onPressEnter={addTag}
          onBlur={addTag} onKeyDown={e => { if (e.key === 'Escape') { setInputVisible(false); setInputVal(''); } }} />
      ) : (
        <Tag style={{ borderStyle: 'dashed', cursor: 'pointer', margin: 0 }} onClick={() => setInputVisible(true)}>+ 标签</Tag>
      )}
    </div>
  );
}

function ProductPicker({ visible, onCancel, onConfirm, existingProducts }) {
  const [products, setProducts] = useState([]);
  const [loading, setLoading] = useState(false);
  const [keyword, setKeyword] = useState('');
  const [total, setTotal] = useState(0);
  const [page, setPage] = useState(1);
  const [selected, setSelected] = useState([]);

  useEffect(() => {
    if (visible) {
      const existing = [];
      const ids = Array.isArray(existingProducts.ids) ? existingProducts.ids : [];
      const titles = Array.isArray(existingProducts.titles) ? existingProducts.titles : [];
      ids.forEach((id, i) => { existing.push({ id, title: titles[i] || id }); });
      setSelected(existing);
      fetchProducts(1);
    }
  }, [visible]);

  const fetchProducts = useCallback(async (p = 1, kw = keyword) => {
    setLoading(true);
    try {
      const params = new URLSearchParams({ page: String(p), limit: '20' });
      if (kw) params.set('keyword', kw);
      const res = await fetch(`${API_BASE}/api/products/search?${params}`);
      const json = await res.json();
      setProducts(json.data || []);
      setTotal(json.total || 0);
      setPage(p);
    } catch (e) { message.error('加载商品失败'); }
    setLoading(false);
  }, [keyword]);

  const toggleProduct = (product) => {
    const exists = selected.find(s => s.id === product._id);
    if (exists) {
      setSelected(selected.filter(s => s.id !== product._id));
    } else {
      setSelected([...selected, { id: product._id, title: product.title }]);
    }
  };

  const isSelected = (productId) => selected.some(s => s.id === productId);

  return (
    <Modal title="选取购买产品（可多选）" open={visible} onCancel={onCancel}
      onOk={() => onConfirm(selected)} okText="确认选取" cancelText="取消" width={750} destroyOnClose>
      <div style={{ marginBottom: 12 }}>
        <Search placeholder="搜索商品标题" onSearch={(v) => { setKeyword(v); fetchProducts(1, v); }} allowClear style={{ width: '100%' }} />
      </div>
      {selected.length > 0 && (
        <div style={{ marginBottom: 10, padding: '8px 12px', background: '#fafafa', borderRadius: 6 }}>
          <span style={{ color: '#666', marginRight: 8 }}>已选 {selected.length} 件：</span>
          {selected.map(s => (
            <Tag key={s.id} closable onClose={() => toggleProduct({ _id: s.id })} color="blue">{s.title}</Tag>
          ))}
        </div>
      )}
      <div style={{ maxHeight: 350, overflowY: 'auto', border: '1px solid #f0f0f0', borderRadius: 6 }}>
        {loading ? <div style={{ padding: 40, textAlign: 'center', color: '#999' }}>加载中...</div> :
         products.length === 0 ? <div style={{ padding: 40, textAlign: 'center', color: '#999' }}>无匹配商品</div> :
         products.map(p => (
           <div key={p._id} className={`product-picker-item ${isSelected(p._id) ? 'selected' : ''}`} onClick={() => toggleProduct(p)}>
             {p.images && p.images[0] ? <img src={p.images[0]} alt="" /> : <div style={{width:40,height:40,background:'#f0f0f0',borderRadius:4,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>🌸</div>}
             <div style={{ flex: 1 }}>
               <div style={{ fontWeight: 500 }}>{p.title}</div>
               <div style={{ fontSize: 12, color: '#999' }}>{p.category || ''} {p.price ? `¥${p.price}` : ''}</div>
             </div>
             <input type="checkbox" checked={isSelected(p._id)} readOnly style={{ width: 18, height: 18, cursor: 'pointer' }} />
           </div>
         ))}
        }
      </div>
      {total > 20 && <div style={{ marginTop: 8, textAlign: 'center' }}>
        <Button size="small" disabled={page <= 1} onClick={() => fetchProducts(page - 1)}>上一页</Button>
        <span style={{ margin: '0 8px', color: '#999' }}>{page} / {Math.ceil(total / 20)}</span>
        <Button size="small" disabled={page >= Math.ceil(total / 20)} onClick={() => fetchProducts(page + 1)}>下一页</Button>
      </div>}
    </Modal>
  );
}


function OrderTagCell({ value, onChange, tagPool = [] }) {
  const [open, setOpen] = React.useState(false);
  const [allTags, setAllTags] = React.useState([]);
  const tags = Array.isArray(value) ? value : [];
  const displayTags = allTags.length ? allTags : tagPool;
  const load = async () => {
    try {
      const r = await fetch(`${TAG_API_BASE}/api/tags?scope=order`);
      const j = await r.json();
      setAllTags(j.data || []);
    } catch(e) { setAllTags([]); }
  };
  return (
    <span onDoubleClick={(e) => { e.stopPropagation(); load(); setOpen(true); }}
      style={{ display:'inline-flex', gap:4, flexWrap:'wrap', minHeight:22, cursor:'pointer', padding:'2px 4px' }}>
      {tags.length === 0 && <span style={{color:'#bbb',fontSize:12}}>双击添加</span>}
      {tags.map(t => {
        const meta = displayTags.find(x => x.name === t) || {};
        return (
          <Tag key={t} color={meta.color || undefined}
               style={meta.bg ? { background: meta.bg, color: meta.color, borderColor: meta.border } : {}}
               closable onClose={(e) => { e.preventDefault(); onChange(tags.filter(x => x !== t)); }}>
            {t}
          </Tag>
        );
      })}
      <Modal open={open} onCancel={() => setOpen(false)} onOk={() => setOpen(false)}
             title="选择/新增标签" footer={null} width={520}>
        <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:12}}>
          {allTags.map(t => {
            const on = tags.includes(t.name);
            return (
              <span key={t.name}
                onClick={() => onChange(on ? tags.filter(x => x !== t.name) : [...tags, t.name])}
                style={{
                  cursor:'pointer', padding:'4px 10px', borderRadius:12, fontSize:13,
                  background: on ? (t.bg || '#e6f7ff') : '#fafafa',
                  color: on ? (t.color || '#1890ff') : '#666',
                  border: '1px solid ' + (on ? (t.border || '#91d5ff') : '#eee'),
                  fontWeight: on ? 600 : 400,
                }}>{t.name}{typeof t.usage_count === 'number' ? ` (${t.usage_count})` : ''}</span>
            );
          })}
          {allTags.length === 0 && <span style={{color:'#999'}}>暂无标签，请在<a href="/tags-admin" target="_blank">标签总控台</a>新建 scope=order 的标签</span>}
        </div>
        <div style={{marginTop:8,fontSize:12,color:'#666'}}>💡 已选：{tags.length ? tags.join('、') : '无'}</div>
      </Modal>
    </span>
  );
}


function App() {
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(false);
  const [pagination, setPagination] = useState({ current: 1, pageSize: 20, total: 0 });
  const [search, setSearch] = useState('');
  const [businessType, setBusinessType] = useState('');
  const [monthFilter, setMonthFilter] = useState(''); // YYYY-MM
  const [tagPool, setTagPool] = React.useState([]);
  const [showTagMgr, setShowTagMgr] = React.useState(false);
  const [showBatchTag, setShowBatchTag] = React.useState(false);
  const fetchTagPool = React.useCallback(async () => {
    try {
      const r = await fetch(`${TAG_API_BASE}/api/tags?scope=order`);
      const j = await r.json();
      setTagPool(j.data || []);
    } catch (e) {}
  }, []);
  React.useEffect(() => { fetchTagPool(); }, []);
  const [stats, setStats] = useState([]);
  const [amountStats, setAmountStats] = useState({ total_income: 0, total_shipping: 0, total_coupon: 0, row_count: 0 });
  const [monthlyStats, setMonthlyStats] = useState({ data: [], totals: { order_count: 0, total_income: 0, total_cost: 0, total_profit: 0, total_shipping: 0, total_coupon: 0, total_expense: 0 } });
  const [monthlyYear, setMonthlyYear] = useState(String(new Date().getFullYear()));
  const [mainTab, setMainTab] = useState('overview'); // 'overview' | 'monthly' | 'huaxiang'
  const [region, setRegion] = useState('cn');
  const [shopName, setShopName] = useState('全部');
  const [shopStats, setShopStats] = useState([]);
  const [tagStats, setTagStats] = useState([]);
  const [tagFilter, setTagFilter] = useState('');
  const [syncStatus, setSyncStatus] = useState(null);
  const [selectedRowKeys, setSelectedRowKeys] = useState([]);
  const [pickerVisible, setPickerVisible] = useState(false);
  const [pickingOrderId, setPickingOrderId] = useState(null);
  const [pickingExisting, setPickingExisting] = useState({ ids: [], titles: [] });

  const fetchData = useCallback(async (page = 1, pageSize = 20, searchVal = search, typeVal = businessType, regionVal = region, shopVal = shopName, monthVal = monthFilter) => {
    setLoading(true);
    try {
      const params = new URLSearchParams({ page, limit: pageSize });
      if (searchVal) params.set('search', searchVal);
      if (typeVal && typeVal !== '全部') params.set('business_type', typeVal);
      if (regionVal) params.set('region', regionVal);
      if (shopVal && shopVal !== '全部') params.set('shop_name', shopVal);
      if (tagFilter) params.set('tag', tagFilter);
      if (monthVal) params.set('month', monthVal);
      const res = await fetch(`${API_BASE}/api/orders?${params}`);
      const json = await res.json();
      setData(json.data || []);
      setPagination(prev => ({ ...prev, current: json.page || page, total: json.total || 0, pageSize }));
    } catch (e) { message.error('加载失败'); }
    setLoading(false);
  }, [search, businessType, region, shopName, monthFilter]);

  const fetchTagStats = useCallback(async () => {
    try {
      const res = await fetch(`${API_BASE}/api/orders/stats/tags`);
      const json = await res.json();
      setTagStats(json.data || []);
    } catch (e) { setTagStats([]); }
  }, []);
  const fetchStats = useCallback(async () => {
    try {
      const res = await fetch(`${API_BASE}/api/orders/stats/business-type`);
      const json = await res.json();
      setStats(json.data || []);
    } catch (e) {}
  }, []);

  const fetchShopStats = useCallback(async () => {
    try {
      const res = await fetch(`${API_BASE}/api/orders/stats/shop-name`);
      const json = await res.json();
      setShopStats(json.data || []);
    } catch (e) {}
  }, []);

  const fetchAmountStats = useCallback(async (searchVal = search, typeVal = businessType, regionVal = region, shopVal = shopName, monthVal = monthFilter) => {
    try {
      const params = new URLSearchParams();
      if (searchVal) params.set('search', searchVal);
      if (typeVal && typeVal !== '全部') params.set('business_type', typeVal);
      if (regionVal) params.set('region', regionVal);
      if (shopVal && shopVal !== '全部') params.set('shop_name', shopVal);
      if (tagFilter) params.set('tag', tagFilter);
      if (monthVal) params.set('month', monthVal);
      const res = await fetch(`${API_BASE}/api/orders/stats/amount?${params}`);
      const json = await res.json();
      setAmountStats(json.data || { total_income: 0, total_shipping: 0, total_coupon: 0, row_count: 0 });
    } catch (e) {}
  }, [search, businessType, region, shopName, monthFilter, tagFilter]);


  const fetchSyncStatus = useCallback(async () => {
    try {
      const res = await fetch(`${API_BASE}/api/orders/sync-status`);
      const json = await res.json();
      setSyncStatus(json);
    } catch (e) {}
  }, []);

  const formatSyncTime = (val) => val ? dayjs(val).format('YYYY-MM-DD HH:mm:ss') : '-';

  const fetchMonthlyStats = useCallback(async (yearVal = monthlyYear) => {
    try {
      const params = new URLSearchParams();
      if (yearVal) params.set('year', yearVal);
      const res = await fetch(`${API_BASE}/api/orders/stats/monthly?${params}`);
      const json = await res.json();
      setMonthlyStats(json || { data: [], totals: {} });
    } catch (e) { setMonthlyStats({ data: [], totals: {} }); }
  }, [monthlyYear]);

  useEffect(() => { fetchData(); fetchStats(); fetchShopStats(); fetchAmountStats(); fetchSyncStatus(); fetchTagStats(); fetchMonthlyStats(); }, []);
  useEffect(() => { fetchData(); }, [tagFilter]);
  useEffect(() => { fetchMonthlyStats(); }, [monthlyYear]);

  const handleTableChange = (pag) => { fetchData(pag.current, pag.pageSize, search, businessType, region, shopName); };
  const onSearch = (val) => { setSearch(val); fetchData(1, 20, val, businessType, region, shopName); fetchAmountStats(val, businessType, region, shopName); };

  const updateCell = async (id, field, value) => {
    try {
      await fetch(`${API_BASE}/api/orders/${id}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ [field]: value }),
      });
      message.success('已更新');
      fetchData(pagination.current);
      fetchAmountStats(search, businessType, region, shopName, monthFilter);
    } catch (e) { message.error('更新失败'); }
  };

  const handleAdd = async () => {
    try {
      const res = await fetch(`${API_BASE}/api/orders`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ business_type: '未设置' }),
      });
      if (res.ok) {
        message.success('已新增空行');
        fetchData(1);
        fetchStats();
        fetchAmountStats(search, businessType, region, shopName, monthFilter);
      } else {
        const d = await res.json();
        message.error(d.error || '新增失败');
      }
    } catch (e) { message.error('新增失败'); }
  };

  const handleDuplicate = async () => {
    if (selectedRowKeys.length === 0) { message.warning('请先选择要复制的记录'); return; }
    try {
      const res = await fetch(`${API_BASE}/api/orders/duplicate`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids: selectedRowKeys }),
      });
      if (res.ok) {
        const d = await res.json();
        if (d.errors && d.errors.length) {
          const firstError = d.errors[0]?.error || '未知错误';
          message.warning(`已复制 ${d.duplicated} 条记录，${d.errors.length} 条失败：${firstError}`);
        } else {
          message.success(`已复制 ${d.duplicated} 条记录`);
        }
        setSelectedRowKeys([]);
        fetchData(1);
        fetchStats();
        fetchAmountStats(search, businessType, region, shopName, monthFilter);
      } else {
        const d = await res.json();
        message.error(d.error || '复制失败');
      }
    } catch (e) { message.error('复制失败'); }
  };

  const handleBatchDelete = async () => {
    if (selectedRowKeys.length === 0) { message.warning('请先选择要删除的记录'); return; }
    try {
      const res = await fetch(`${API_BASE}/api/orders/batch-delete`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids: selectedRowKeys }),
      });
      if (res.ok) {
        message.success(`已删除 ${selectedRowKeys.length} 条记录`);

      if (!d.success) throw new Error(d.error || '导出失败');
      const rows = d.data || [];
      if (!rows.length) { message.warning({ content: '无数据', key: 'settle' }); return; }
      const headers = ['订单号','订单时间','会员ID','会员/收货人','手机号','收货地址','店铺名','业务类型','商品明细','订单总价','运费','优惠','销售额','成本','利润','支付渠道','订单状态','发货状态','支付状态','标签','区域'];

      const money = (v) => Number(v || 0).toFixed(2);
      const lines = [headers.join(',')];
      let ti = 0, tc = 0, tp = 0;
      rows.forEach(o => {
        const titles = Array.isArray(o.product_title) ? o.product_title.join(' | ') : (o.product_title || '');
        const tags = Array.isArray(o.tags) ? o.tags.join('|') : (o.personal_tag || '');

        tc += Number(o.cost_amount || 0);
        tp += Number(o.profit_amount || 0);
        lines.push([
          o.payment_order_id || o.source_order_sn || o.id,
          dayjs(o.purchase_time).format('YYYY-MM-DD HH:mm'),
          o.member_id, o.consignee || o.member_name, o.phone, o.delivery_address,
          o.shop_name, o.business_type, titles,
          money(o.product_subtotal), money(o.shipping_fee), money(o.coupon_discount),
          money(o.income_amount), money(o.cost_amount), money(o.profit_amount),
          o.payment_channel, o.order_status, o.shipping_status, o.pay_status,
          tags, o.region
        ].map(esc).join(','));

// ============ 订单 · 标签管理 ============
function OrderTagManagerModal({ tagPool, onClose, onChanged }) {
  const [items, setItems] = React.useState(tagPool || []);
  const [name, setName] = React.useState('');
  const [color, setColor] = React.useState('#722ed1');
  const [bg, setBg] = React.useState('#f9f0ff');
  const [border, setBorder] = React.useState('#d3adf7');
  const [busy, setBusy] = React.useState(false);
  const refresh = async () => {
    const r = await fetch(`${TAG_API_BASE}/api/tags?scope=order`);
    const d = await r.json();
    if (d.success) setItems(d.data || []);
    onChanged && onChanged();
  };
  const add = async () => {
    const nm = name.trim();
    if (!nm) return message.warning('请输入标签名');
    setBusy(true);
    try {
      const r = await fetch(`${TAG_API_BASE}/api/tags`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: nm, color, bg, border, scope: ['order'] })
      });
      const d = await r.json();
      if (!d.success) throw new Error(d.error || '添加失败');
      setName(''); await refresh();
    } catch (e) { message.error(e.message); }
    setBusy(false);
  };
  const del = async (nm) => {
    if (!confirm('确认删除标签[' + nm + ']？已打上此标签的订单不会被删除，但会失去该标签。')) return;
    try {
      const r = await fetch(`${TAG_API_BASE}/api/tags/${encodeURIComponent(nm)}`, { method: 'DELETE' });
      const d = await r.json();
      if (!d.success) throw new Error(d.error || '删除失败');
      await refresh();
    } catch (e) { message.error(e.message); }
  };
  const PALETTE = [
    { color: '#722ed1', bg: '#f9f0ff', border: '#d3adf7', label: '紫' },
    { color: '#eb2f96', bg: '#fff0f6', border: '#ffadd2', label: '粉' },
    { color: '#fa541c', bg: '#fff2e8', border: '#ffbb96', label: '橙' },
    { color: '#faad14', bg: '#fffbe6', border: '#ffe58f', label: '金' },
    { color: '#52c41a', bg: '#f6ffed', border: '#b7eb8f', label: '绿' },
    { color: '#13c2c2', bg: '#e6fffb', border: '#87e8de', label: '青' },
    { color: '#1890ff', bg: '#e6f7ff', border: '#91d5ff', label: '蓝' },
    { color: '#2f54eb', bg: '#f0f5ff', border: '#adc6ff', label: '靖' },
    { color: '#a0522d', bg: '#fff7e6', border: '#f4a460', label: '棕' },
    { color: '#08979c', bg: '#e6fffb', border: '#5cdbd3', label: '松' },
    { color: '#7cb305', bg: '#fcffe6', border: '#d3f261', label: '柳' },
    { color: '#c41d7f', bg: '#fff0f6', border: '#ffd6e7', label: '玫' },
  ];
  return (
    <Modal open={true} onCancel={onClose} footer={null} width={600}
      title={<span style={{color:'#722ed1'}}>🏷️ 订单标签池 · 管理</span>}>
      <div style={{ background: '#fafafa', padding: 14, borderRadius: 8, marginBottom: 16, border: '1px solid #f0f0f0' }}>
        <div style={{ fontSize: 12, color: '#666', marginBottom: 8, fontWeight: 600 }}>➕ 新增标签</div>
        <div style={{ display: 'flex', gap: 8, marginBottom: 10 }}>
          <input value={name} onChange={e => setName(e.target.value)} placeholder="标签名（如：北京花卉订单、VIP、退款订单...）"
            style={{ flex: 1, padding: '6px 10px', border: '1px solid #d9d9d9', borderRadius: 6, fontSize: 12, outline: 'none' }} />
          <Button type="primary" loading={busy} onClick={add} disabled={!name.trim()} style={{background:'#722ed1',borderColor:'#722ed1'}}>添加</Button>
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap' }}>
          <span style={{ fontSize: 11, color: '#999' }}>配色：</span>
          {PALETTE.map((pl, i) => (
            <span key={i} onClick={() => { setColor(pl.color); setBg(pl.bg); setBorder(pl.border); }}
              title={pl.label}
              style={{ cursor: 'pointer', padding: '2px 10px', borderRadius: 10, background: pl.bg, color: pl.color, border: '2px solid ' + (color === pl.color ? pl.color : pl.border), fontSize: 11, fontWeight: 600 }}>
              {pl.label}
            </span>
          ))}
          <span style={{ marginLeft: 6, padding: '2px 10px', borderRadius: 10, background: bg, color, border: '1px solid ' + border, fontSize: 11, fontWeight: 600 }}>{name || '预览'}</span>
        </div>
      </div>
      <div style={{ fontSize: 12, color: '#666', marginBottom: 8, fontWeight: 600 }}>📋 现有标签 ({items.length})</div>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, maxHeight: 320, overflow: 'auto' }}>
        {items.length === 0 && <div style={{ color: '#999', fontSize: 12, padding: 20, width: '100%', textAlign: 'center' }}>暂无标签</div>}
        {items.map(t => (
          <div key={t.name} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '4px 6px 4px 10px', borderRadius: 14, background: t.bg || '#f9f0ff', border: '1px solid ' + (t.border || '#d3adf7') }}>
            <span style={{ color: t.color || '#722ed1', fontSize: 12, fontWeight: 500 }}>{t.name}</span>
            {t.usage_count > 0 && <span style={{ color: '#999', fontSize: 10 }}>x{t.usage_count}</span>}
            <button onClick={() => del(t.name)} title="删除"
              style={{ border: 'none', background: 'rgba(0,0,0,0.06)', color: '#666', borderRadius: '50%', width: 18, height: 18, cursor: 'pointer', fontSize: 12, lineHeight: '18px', padding: 0 }}>×</button>
          </div>
        ))}
      </div>
    </Modal>
  );
}

// ============ 订单 · 批量打标签 ============
function OrderBatchTagModal({ ids, tagPool, onClose, onSaved }) {
  const [selected, setSelected] = React.useState(new Set());
  const [mode, setMode] = React.useState('add');
  const [busy, setBusy] = React.useState(false);
  const toggle = (n) => { const x = new Set(selected); if (x.has(n)) x.delete(n); else x.add(n); setSelected(x); };
  const save = async () => {
    if (selected.size === 0) return message.warning('请先选择标签');
    setBusy(true);
    try {
      const r = await fetch(`${TAG_API_BASE}/api/tags/apply`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ entity: 'order', ids, tags: [...selected], mode })
      });
      const d = await r.json();
      if (!d.success) throw new Error(d.error || '保存失败');
      message.success(`已${mode==='add'?'追加':mode==='remove'?'移除':'覆盖'}到 ${d.updated} 条订单`);
      onSaved();
    } catch (e) { message.error(e.message); setBusy(false); }
  };
  return (
    <Modal open={true} onCancel={onClose} footer={null} width={520}
      title={<span style={{color:'#3949ab'}}>🏷️ 批量打标签 · {ids.length} 条订单</span>}>
      <div style={{ marginBottom: 12, display: 'flex', gap: 12 }}>
        <label style={{ fontSize: 12, cursor: 'pointer' }}><input type="radio" checked={mode === 'add'} onChange={() => setMode('add')} /> 追加</label>
        <label style={{ fontSize: 12, cursor: 'pointer' }}><input type="radio" checked={mode === 'remove'} onChange={() => setMode('remove')} /> 移除</label>
        <label style={{ fontSize: 12, cursor: 'pointer' }}><input type="radio" checked={mode === 'set'} onChange={() => setMode('set')} /> 覆盖</label>
      </div>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 16, maxHeight: 320, overflow: 'auto' }}>
        {tagPool.map(t => {
          const on = selected.has(t.name);
          return (
            <span key={t.name} onClick={() => toggle(t.name)}
              style={{ cursor: 'pointer', padding: '4px 12px', borderRadius: 12, fontSize: 12, background: on ? (t.bg || '#f9f0ff') : '#fff', color: on ? (t.color || '#722ed1') : '#888', border: '1px solid ' + (on ? (t.border || '#d3adf7') : '#ddd'), fontWeight: on ? 600 : 400 }}>
              {on ? '✓ ' : ''}{t.name}{t.usage_count > 0 ? ` (${t.usage_count})` : ''}
            </span>
          );
        })}
        {tagPool.length === 0 && <span style={{ color: '#999', fontSize: 12 }}>标签池为空，请先到「🏷️ 标签管理」新建</span>}
      </div>
      <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
        <Button onClick={onClose}>取消</Button>
        <Button type="primary" loading={busy} onClick={save} disabled={selected.size === 0}
          style={{background:'#3949ab',borderColor:'#3949ab'}}>
          应用到 {ids.length} 条
        </Button>
      </div>
    </Modal>
  );
}


// ============ 🌐 外部订单同步 (花像花木 admin) ============
function HuaxiangSyncTab({ apiBase, onBack }) {
  const [shops, setShops] = React.useState([]);
  const [shopId, setShopId] = React.useState('');
  const [shopInfo, setShopInfo] = React.useState(null);
  const [orderStatus, setOrderStatus] = React.useState('0');
  const [paymentMethod, setPaymentMethod] = React.useState('0');
  const [dateRange, setDateRange] = React.useState(() => {
    const end = new Date();
    const start = new Date(); start.setDate(start.getDate() - 29);
    return [start, end];
  });
  const [productName, setProductName] = React.useState('');
  const [keyword, setKeyword] = React.useState('');
  const [searchStatus, setSearchStatus] = React.useState('');
  const [sort, setSort] = React.useState(false);
  const [previewRows, setPreviewRows] = React.useState([]);
  const [previewTotal, setPreviewTotal] = React.useState(0);
  const [previewPage, setPreviewPage] = React.useState(1);
  const [previewPageSize, setPreviewPageSize] = React.useState(20);
  const [previewBusy, setPreviewBusy] = React.useState(false);
  const [syncBusy, setSyncBusy] = React.useState(false);
  const [syncResult, setSyncResult] = React.useState(null);
  const [errMsg, setErrMsg] = React.useState('');
  const [lastSyncByShop, setLastSyncByShop] = React.useState({}); // shopId -> {scanned, inserted, updated, time}

  const fmtDate = (d) => dayjs(d).format('YYYY-MM-DD');

  const fetchShops = React.useCallback(async () => {
    try {
      const r = await fetch(`${apiBase}/api/orders/huaxiang/shops`);
      const j = await r.json();
      setShops(j.data || []);
      if ((j.data || []).length && !shopId) setShopId(String(j.data[0].id));
    } catch (e) { setErrMsg('加载店铺列表失败: ' + e.message); }
  }, [apiBase, shopId]);

  React.useEffect(() => { fetchShops(); }, []);

  const selectedShop = shops.find(s => String(s.id) === String(shopId)) || null;

  const buildFilters = () => {
    const f = {
      orderStatus: orderStatus,
      paymentMethod,
      sort,
      productName: productName.trim(),
      keyword: keyword.trim(),
      searchStatus,
    };
    if (dateRange && dateRange[0]) f.startTime = fmtDate(dateRange[0]) + ' 00:00:00';
    if (dateRange && dateRange[1]) f.endTime = fmtDate(dateRange[1]) + ' 23:59:59';
    return f;
  };

  const fetchPreview = async (page = 1, pageSize = previewPageSize) => {
    if (!shopId) return message.warning('请先选店铺');
    const shop = selectedShop;
    if (!shop || !shop.has_token) return message.warning('该店铺还没配 Token, 请先到店铺管理里填');
    if (!shop.huaxiang_platform_id) return message.warning('该店铺还没配 平台ID, 请先到店铺管理里填');
    setPreviewBusy(true);
    setErrMsg('');
    try {
      const f = buildFilters();
      const params = new URLSearchParams({ shopId, pageNumber: String(page), pageSize: String(pageSize) });
      Object.entries(f).forEach(([k, v]) => { if (v !== '' && v !== false && v !== null && v !== undefined) params.set(k, v); });
      const res = await fetch(`${apiBase}/api/orders/huaxiang/preview?${params.toString()}`);
      const j = await res.json();
      if (!res.ok || j.error) throw new Error(j.error || `HTTP ${res.status}`);
      setPreviewRows(j.rows || []);
      setPreviewTotal(j.total || 0);
      setPreviewPage(page);
      setPreviewPageSize(pageSize);
      setShopInfo(j.shop || null);
    } catch (e) {
      setErrMsg(e.message);
      setPreviewRows([]);
      setPreviewTotal(0);
      message.error('拉取预览失败: ' + e.message);
    }
    setPreviewBusy(false);
  };

  const runSync = async () => {
    if (!shopId) return message.warning('请先选店铺');
    if (!previewTotal && !previewRows.length) return message.warning('请先拉取预览, 确认筛选条件正确');
    Modal.confirm({
      title: '确认同步到本地 purchase_orders?',
      content: <div>
        <div style={{ marginBottom: 6 }}>店铺: <b>{selectedShop?.shop_name}</b> (platformId={selectedShop?.huaxiang_platform_id})</div>
        <div style={{ marginBottom: 6 }}>筛选: 订单状态=<b>{orderStatus === '' ? '全部' : ORDER_STATUS_OPTIONS.find(o => o.value === orderStatus)?.label || orderStatus}</b>, 支付方式=<b>{paymentMethod === '0' ? '全部' : PAYMENT_METHOD_OPTIONS.find(o => o.value === paymentMethod)?.label || paymentMethod}</b></div>
        <div style={{ marginBottom: 6 }}>日期: <b>{dateRange?.[0] ? fmtDate(dateRange[0]) : '不限'} ~ {dateRange?.[1] ? fmtDate(dateRange[1]) : '不限'}</b></div>
        <div style={{ marginBottom: 6 }}>预览: 共 <b>{previewTotal}</b> 条, 当前页 <b>{previewRows.length}</b> 条</div>
        <div style={{ color: '#888', fontSize: 12 }}>提示: 将分页拉上游接口(默认 50 条/页, 最多 30 页 = 1500 条),按 source_order_sn upsert 到 purchase_orders(source_table='huaxiang_porder'), 自动打"北京花卉订单"标签</div>
      </div>,
      okText: '开始同步', cancelText: '取消',
      onOk: async () => {
        setSyncBusy(true);
        setErrMsg('');
        try {
          const body = buildFilters();
          body.shopId = shopId;
          body.pageSize = 50;
          body.maxPages = 30;
          const res = await fetch(`${apiBase}/api/orders/sync-huaxiang`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          const j = await res.json();
          if (!res.ok || j.error) throw new Error(j.error || `HTTP ${res.status}`);
          setSyncResult(j);
          setLastSyncByShop(prev => ({ ...prev, [shopId]: {
            scanned: j.scanned, inserted: j.inserted, updated: j.updated, errors: j.errors,
            time: new Date().toLocaleString('zh-CN'),
          }}));
          message.success(`同步完成 · 扫描 ${j.scanned} / 新增 ${j.inserted} / 更新 ${j.updated} / 失败 ${j.errors}`);
        } catch (e) {
          setErrMsg(e.message);
          message.error('同步失败: ' + e.message);
        }
        setSyncBusy(false);
      },
    });
  };

  const ORDER_STATUS_OPTIONS = [
    { value: '', label: '全部订单' },
    { value: '0', label: '未确认' },
    { value: '1', label: '已确认' },
    { value: '2', label: '已完成' },
    { value: '3', label: '已取消' },
  ];
  const PAYMENT_METHOD_OPTIONS = [
    { value: '0', label: '全部' },
    { value: '1', label: '微信收单' },
    { value: '2', label: '银联收单' },
    { value: '3', label: '线上支付' },
    { value: '4', label: '线下支付' },
  ];
  const SEARCH_STATUS_OPTIONS = [
    { value: '', label: '不搜' },
    { value: '0', label: '订单号' },
    { value: '1', label: '买家邀请码' },
    { value: '2', label: '收货人手机号' },
    { value: '3', label: '买家手机号' },
    { value: '4', label: '订单ID' },
    { value: '7', label: '收货人姓名' },
    { value: '8', label: '外部平台单号' },
    { value: '10', label: '源订单号' },
  ];

  const previewColumns = [
    { title: '#', key: 'idx', width: 50, render: (_, r, i) => (previewPage - 1) * previewPageSize + i + 1 },
    { title: '订单号', dataIndex: 'order_sn', width: 160, render: v => <span style={{ fontFamily: 'monospace', fontSize: 12 }}>{v}</span> },
    { title: '下单时间', dataIndex: 'purchase_time', width: 150, render: v => v ? dayjs(v).format('YYYY-MM-DD HH:mm') : '-' },
    { title: '收货人', dataIndex: 'consignee', width: 100 },
    { title: '手机', dataIndex: 'phone', width: 120 },
    { title: '支付方式', dataIndex: 'paymentMethod', width: 100 },
    { title: '实付金额', dataIndex: 'payAmount', width: 100, align: 'right', render: v => <b style={{ color: '#3f8600' }}>¥{Number(v||0).toFixed(2)}</b> },
    { title: '运费', dataIndex: 'freight', width: 80, align: 'right', render: v => Number(v||0).toFixed(2) },
    { title: '订单状态', dataIndex: 'orderStatus', width: 90 },
    { title: '支付状态', dataIndex: 'paymentStatus', width: 90, render: v => {
        const colorMap = { '已支付': '#52c41a', '未支付': '#faad14', '部分支付': '#faad14', '已退款': '#cf1322' };
        return v ? <Tag color={colorMap[v] || 'default'}>{v}</Tag> : '-';
      } },
    { title: '配送状态', dataIndex: 'shippingStatus', width: 90 },
    { title: '商品', dataIndex: 'productName', ellipsis: true },
  ];

  return (
    <Card size="small" style={{ marginBottom: 12 }} bodyStyle={{ padding: '14px 18px' }}
      title={<span><span style={{ color: '#722ed1', fontWeight: 600 }}>🌐 外部订单同步</span>
        <span style={{ fontSize: 12, color: '#888', marginLeft: 12 }}>从 admin.huaxianghuamu.cn/#/statcenter/porder 拉订单 → purchase_orders</span>
      </span>}
      extra={<Space>
        <Button size="small" onClick={() => onBack && onBack()}>← 返回总览</Button>
      </Space>}>
      {/* 1. 筛选器 — 一一对应源页面顶部 */}
      <div style={{ background: '#f9f0ff', padding: 12, borderRadius: 6, marginBottom: 12 }}>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 12, alignItems: 'center' }}>
          <div>
            <div style={{ fontSize: 11, color: '#888' }}>店铺 (platformId)</div>
            <Select value={shopId || undefined} onChange={setShopId} placeholder="选店铺 (店铺管理里配过 Token 的)"
              style={{ width: 240 }} size="small" showSearch optionFilterProp="children">
              {shops.map(s => (
                <Select.Option key={s.id} value={String(s.id)}>
                  <span style={{ fontWeight: 500 }}>{s.shop_name}</span>
                  <span style={{ color: '#888', fontSize: 11, marginLeft: 6 }}>platformId={s.huaxiang_platform_id}{s.has_token ? ' ✓Token' : ' ⚠未配Token'}</span>
                </Select.Option>
              ))}
            </Select>
          </div>
          <div>
            <div style={{ fontSize: 11, color: '#888' }}>订单状态</div>
            <Select value={orderStatus} onChange={setOrderStatus} style={{ width: 130 }} size="small" options={ORDER_STATUS_OPTIONS} />
          </div>
          <div>
            <div style={{ fontSize: 11, color: '#888' }}>支付方式</div>
            <Select value={paymentMethod} onChange={setPaymentMethod} style={{ width: 130 }} size="small" options={PAYMENT_METHOD_OPTIONS} />
          </div>
          <div>
            <div style={{ fontSize: 11, color: '#888' }}>日期范围</div>
            <DatePicker.RangePicker
              value={dateRange}
              onChange={(v) => setDateRange(v || [])}
              size="small"
              format="YYYY-MM-DD"
              presets={[
                { label: '今天', value: [dayjs().startOf('day'), dayjs().endOf('day')] },
                { label: '昨天', value: [dayjs().subtract(1,'day').startOf('day'), dayjs().subtract(1,'day').endOf('day')] },
                { label: '近 7 天', value: [dayjs().subtract(6,'day').startOf('day'), dayjs().endOf('day')] },
                { label: '近 30 天', value: [dayjs().subtract(29,'day').startOf('day'), dayjs().endOf('day')] },
                { label: '本月', value: [dayjs().startOf('month'), dayjs().endOf('month')] },
                { label: '上月', value: [dayjs().subtract(1,'month').startOf('month'), dayjs().subtract(1,'month').endOf('month')] },
              ]}
            />
          </div>
          <div>
            <div style={{ fontSize: 11, color: '#888' }}>商品名称</div>
            <Input value={productName} onChange={e => setProductName(e.target.value)} placeholder="模糊匹配" size="small" style={{ width: 160 }} allowClear />
          </div>
        </div>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 12, alignItems: 'center', marginTop: 10 }}>
          <div>
            <div style={{ fontSize: 11, color: '#888' }}>关键词搜索类型</div>
            <Select value={searchStatus} onChange={setSearchStatus} style={{ width: 160 }} size="small" options={SEARCH_STATUS_OPTIONS} />
          </div>
          <div style={{ flex: 1, minWidth: 200 }}>
            <div style={{ fontSize: 11, color: '#888' }}>关键词</div>
            <Input value={keyword} onChange={e => setKeyword(e.target.value)} placeholder="按上面类型搜" size="small" allowClear />
          </div>
          <div>
            <div style={{ fontSize: 11, color: '#888' }}>&nbsp;</div>
            <Checkbox checked={sort} onChange={e => setSort(e.target.checked)}>付款时间倒序</Checkbox>
          </div>
          <div>
            <div style={{ fontSize: 11, color: '#888' }}>&nbsp;</div>
            <Space>
              <Button type="primary" size="small" loading={previewBusy} onClick={() => fetchPreview(1)} style={{ background: '#722ed1', borderColor: '#722ed1' }}>
                🔍 拉取预览
              </Button>
              <Button type="primary" size="small" loading={syncBusy} onClick={runSync} disabled={!previewTotal}
                style={{ background: '#52c41a', borderColor: '#52c41a' }}>
                📥 同步到本地 ({previewTotal} 条)
              </Button>
            </Space>
          </div>
        </div>
        {selectedShop && !selectedShop.has_token && (
          <Alert type="warning" showIcon style={{ marginTop: 10 }}
            message={`店铺「${selectedShop.shop_name}」还没配 Token`}
            description="请到「店铺管理」(http://100.96.54.109:31004) 给这条记录填上 花像花木 Token + platformId,然后回这里刷新。Token 是 admin 页面 cookie 里的 ajaxtoken 值。"
          />
        )}
      </div>

      {/* 2. 预览 */}
      {previewRows.length > 0 && (
        <div style={{ marginBottom: 12 }}>
          <div style={{ marginBottom: 6, color: '#666', fontSize: 12 }}>
            预览: 共 <b>{previewTotal}</b> 条 · 当前第 {previewPage} 页 · 店铺 <b>{shopInfo?.shop_name}</b> (platformId={shopInfo?.huaxiang_platform_id})
          </div>
          <Table size="small" dataSource={previewRows} rowKey={(r, i) => (r.order_id || r.source_order_sn || '') + '_' + i}
            columns={previewColumns}
            pagination={{
              current: previewPage, pageSize: previewPageSize, total: previewTotal, showSizeChanger: true,
              onChange: (p, ps) => fetchPreview(p, ps),
              showTotal: (t) => `共 ${t} 条`,
            }}
            scroll={{ x: 1200 }} />
        </div>
      )}

      {/* 3. 最近同步结果 */}
      {syncResult && (
        <div style={{ background: '#f6ffed', border: '1px solid #b7eb8f', padding: 10, borderRadius: 6, marginBottom: 12 }}>
          <div style={{ fontWeight: 600, color: '#389e0d', marginBottom: 6 }}>✅ 上次同步结果</div>
          <Space wrap>
            <span>扫描: <b>{syncResult.scanned}</b></span>
            <span>新增: <b style={{ color: '#3f8600' }}>{syncResult.inserted}</b></span>
            <span>更新: <b style={{ color: '#1677ff' }}>{syncResult.updated}</b></span>
            <span>失败: <b style={{ color: syncResult.errors ? '#cf1322' : '#999' }}>{syncResult.errors}</b></span>
            <span>上游 total: <b>{syncResult.total}</b></span>
            <span>店铺: <b>{syncResult.shop?.shop_name}</b></span>
          </Space>
          {syncResult.errorList && syncResult.errorList.length > 0 && (
            <div style={{ marginTop: 8, fontSize: 12, color: '#cf1322' }}>
              ⚠ 错误样例: {syncResult.errorList.map((e, i) => <div key={i}>· {e.message}</div>)}
            </div>
          )}
        </div>
      )}

      {errMsg && <Alert type="error" message={errMsg} showIcon style={{ marginBottom: 12 }} />}

      {/* 4. 上次同步记录 */}
      {Object.keys(lastSyncByShop).length > 0 && (
        <div style={{ fontSize: 12, color: '#888' }}>
          最近同步: {Object.entries(lastSyncByShop).map(([sid, v]) => {
            const s = shops.find(x => String(x.id) === sid);
            return <span key={sid} style={{ marginRight: 16 }}>{s?.shop_name || sid} · {v.time} · 新增{v.inserted}/更新{v.updated}</span>;
          })}
        </div>
      )}
    </Card>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
