<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>购买订单管理</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.12.8/dist/reset.min.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/antd@5.12.8/dist/antd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.9/babel.min.js"></script>
<style>
  body { margin: 0; background: #f5f5f5; }
  .app-header { background: #fff; padding: 16px 24px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; }
  .app-header h2 { margin: 0; }
  .app-content { padding: 24px; max-width: 1400px; margin: 0 auto; }
  .stat-cards { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;
const { Table, Button, Input, Space, Modal, Form, Select, Tag, message, Card, Statistic, Row, Col, Popconfirm, Tooltip } = antd;
const { Search } = Input;

const API_BASE = window.location.origin;

function App() {
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(false);
  const [pagination, setPagination] = useState({ current: 1, pageSize: 20, total: 0 });
  const [search, setSearch] = useState('');
  const [businessType, setBusinessType] = useState('');
  const [modalOpen, setModalOpen] = useState(false);
  const [editRecord, setEditRecord] = useState(null);
  const [stats, setStats] = useState([]);
  const [form] = Form.useForm();

  const fetchData = useCallback(async (page = 1, pageSize = 20, searchVal = search, typeVal = businessType) => {
    setLoading(true);
    try {
      const params = new URLSearchParams({ page, limit: pageSize });
      if (searchVal) params.set('search', searchVal);
      if (typeVal && typeVal !== '全部') params.set('business_type', typeVal);
      const res = await fetch(`${API_BASE}/api/orders?${params}`);
      const json = await res.json();
      setData(json.data || []);
      setPagination(prev => ({ ...prev, current: json.page || page, total: json.total || 0, pageSize }));
    } catch (e) { message.error('加载失败'); }
    setLoading(false);
  }, [search, businessType]);

  const fetchStats = useCallback(async () => {
    try {
      const res = await fetch(`${API_BASE}/api/orders/stats/business-type`);
      const json = await res.json();
      setStats(json.data || []);
    } catch (e) {}
  }, []);

  useEffect(() => { fetchData(); fetchStats(); }, []);

  const handleTableChange = (pag) => {
    fetchData(pag.current, pag.pageSize);
  };

  const onSearch = (val) => { setSearch(val); fetchData(1, 20, val, businessType); };

  const handleAdd = () => { setEditRecord(null); form.resetFields(); setModalOpen(true); };

  const handleEdit = (record) => {
    setEditRecord(record);
    form.setFieldsValue({
      member_id: record.member_id,
      member_name: record.member_name,
      phone: record.phone,
      business_type: record.business_type,
      purchase_time: record.purchase_time ? dayjs(record.purchase_time) : null,
      delivery_address: record.delivery_address,
    });
    setModalOpen(true);
  };

  const handleDelete = async (id) => {
    try {
      await fetch(`${API_BASE}/api/orders/${id}`, { method: 'DELETE' });
      message.success('删除成功');
      fetchData(pagination.current);
      fetchStats();
    } catch (e) { message.error('删除失败'); }
  };

  const handleSubmit = async () => {
    try {
      const values = await form.validateFields();
      const payload = {
        ...values,
        purchase_time: values.purchase_time ? values.purchase_time.toISOString() : new Date().toISOString(),
      };
      if (editRecord) {
        await fetch(`${API_BASE}/api/orders/${editRecord.id}`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        message.success('更新成功');
      } else {
        await fetch(`${API_BASE}/api/orders`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        message.success('创建成功');
      }
      setModalOpen(false);
      fetchData(pagination.current);
      fetchStats();
    } catch (e) { message.error('操作失败'); }
  };

  const typeColors = { '微商': 'green', '单店': 'blue', '团购/电商': 'purple', '连锁': 'orange', '未设置': 'default' };

  const columns = [
    { title: 'ID', dataIndex: 'id', width: 70, sorter: true },
    { title: '会员ID', dataIndex: 'member_id', width: 100 },
    { title: '会员名', dataIndex: 'member_name', width: 200, ellipsis: true,
      render: (t) => <Tooltip title={t}><span>{t}</span></Tooltip> },
    { title: '手机号', dataIndex: 'phone', width: 140 },
    { title: '经营类型', dataIndex: 'business_type', width: 110,
      render: (t) => <Tag color={typeColors[t] || 'default'}>{t}</Tag> },
    { title: '购买时间', dataIndex: 'purchase_time', width: 170,
      render: (t) => t ? dayjs(t).format('YYYY-MM-DD HH:mm') : '-' },
    { title: '收货地址', dataIndex: 'delivery_address', width: 200, ellipsis: true,
      render: (t) => <Tooltip title={t}><span>{t || '-'}</span></Tooltip> },
    { title: '操作', width: 120, fixed: 'right',
      render: (_, r) => (
        <Space size="small">
          <Button type="link" size="small" onClick={() => handleEdit(r)}>编辑</Button>
          <Popconfirm title="确定删除?" onConfirm={() => handleDelete(r.id)}>
            <Button type="link" size="small" danger>删除</Button>
          </Popconfirm>
        </Space>
      ),
    },
  ];

  return (
    <div>
      <div className="app-header">
        <h2>🛒 购买订单管理</h2>
        <Space>
          <Search placeholder="搜索会员名/手机号/ID" onSearch={onSearch} allowClear style={{ width: 280 }} />
          <Select value={businessType || '全部'} onChange={(v) => { setBusinessType(v); fetchData(1, 20, search, v); }}
            style={{ width: 130 }} options={[
              { value: '全部', label: '全部类型' },
              { value: '微商', label: '微商' },
              { value: '单店', label: '单店' },
              { value: '团购/电商', label: '团购/电商' },
              { value: '连锁', label: '连锁' },
              { value: '未设置', label: '未设置' },
            ]} />
          <Button type="primary" onClick={handleAdd}>+ 新增订单</Button>
        </Space>
      </div>
      <div className="app-content">
        <Row gutter={16} style={{ marginBottom: 16 }}>
          {stats.map(s => (
            <Col key={s.business_type}>
              <Card size="small"><Statistic title={s.business_type} value={parseInt(s.count)} /></Card>
            </Col>
          ))}
        </Row>
        <Table columns={columns} dataSource={data} rowKey="id" loading={loading}
          pagination={{ ...pagination, showSizeChanger: true, showTotal: (t) => `共 ${t} 条` }}
          onChange={handleTableChange} scroll={{ x: 1200 }} size="middle" />
      </div>
      <Modal title={editRecord ? '编辑订单' : '新增订单'} open={modalOpen} onOk={handleSubmit} onCancel={() => setModalOpen(false)} width={560}>
        <Form form={form} layout="vertical">
          <Form.Item name="member_id" label="会员ID" rules={[{ required: true, message: '请输入会员ID' }]}>
            <Input disabled={!!editRecord} />
          </Form.Item>
          <Form.Item name="member_name" label="会员名" rules={[{ required: true, message: '请输入会员名' }]}>
            <Input />
          </Form.Item>
          <Form.Item name="phone" label="手机号" rules={[{ required: true, message: '请输入手机号' }]}>
            <Input />
          </Form.Item>
          <Form.Item name="business_type" label="经营类型">
            <Select options={[
              { value: '未设置' }, { value: '微商' }, { value: '单店' },
              { value: '团购/电商' }, { value: '连锁' },
            ]} />
          </Form.Item>
          <Form.Item name="purchase_time" label="购买时间">
            <antd.DatePicker showTime style={{ width: '100%' }} />
          </Form.Item>
          <Form.Item name="delivery_address" label="收货地址">
            <Input.TextArea rows={2} />
          </Form.Item>
        </Form>
      </Modal>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
