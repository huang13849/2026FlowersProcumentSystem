function EditableCell({ value, onChange, type = 'text', options, displayRender = null }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(value);
  const ref = useRef(null);

  useEffect(() => { setVal(value); }, [value]);
  useEffect(() => { if (editing && ref.current) ref.current.focus(); }, [editing]);

  const confirm = () => { setEditing(false); if (val !== value) onChange(val); };
  const cancel = () => { setEditing(false); setVal(value); };

  if (type === 'select') {
    if (editing) return (
      <Select ref={ref} className="editable-cell-select" value={val} onChange={v => { setVal(v); setTimeout(() => { onChange(v); setEditing(false); }, 50); }}
        onBlur={() => setEditing(false)} options={options} size="small" style={{ width: '100%' }}
        open onDropdownVisibleChange={v => { if (!v) setEditing(false); }} />
    );
    return <span className="cell-display" onDoubleClick={() => setEditing(true)}>{displayRender ? displayRender() : (value ? <Tag color={typeColors[value] || 'default'}>{value}</Tag> : <span style={{color:'#bbb'}}>双击编辑</span>)}</span>;
  }

  if (editing) return <Input ref={ref} className="editable-cell-input" value={val || ''} onChange={e => setVal(e.target.value)}
    onPressEnter={confirm} onBlur={confirm} onKeyDown={e => { if (e.key === 'Escape') cancel(); }} size="small" />;
  return <span className="cell-display" onDoubleClick={() => setEditing(true)}>{value || <span style={{color:'#bbb'}}>-</span>}</span>;
}

function MoneyEditableCell({ value, onChange }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(value != null ? Number(value) : 0);
  const ref = useRef(null);

  useEffect(() => { setVal(value != null ? Number(value) : 0); }, [value]);
  useEffect(() => { if (editing && ref.current) ref.current.focus(); }, [editing]);

  const confirm = () => {
    setEditing(false);
    const next = Number(val || 0);
    if (next !== Number(value || 0)) onChange(next);
  };

  if (editing) return (
    <InputNumber ref={ref} value={val} precision={2} controls={false}
      prefix="¥" style={{ width: '100%' }} size="small"
      onChange={v => setVal(v)} onPressEnter={confirm} onBlur={confirm}
      onKeyDown={e => { if (e.key === 'Escape') { setEditing(false); setVal(value != null ? Number(value) : 0); } }} />
  );
  return (
    <span className="cell-display" onDoubleClick={() => setEditing(true)} style={{ textAlign: 'right', display: 'block' }}>
      ¥{Number(value || 0).toFixed(2)}
    </span>
  );
}


function PersonalTagEditor({ value, onChange }) {
  const [tags, setTags] = useState([]);
  const [inputVisible, setInputVisible] = useState(false);
  const [inputVal, setInputVal] = useState('');
  const inputRef = useRef(null);

  useEffect(() => {
    if (value && typeof value === 'string' && value.trim()) {
      setTags(value.split(',').map(t => t.trim()).filter(Boolean));
    } else {
      setTags([]);
    }
  }, [value]);

  useEffect(() => { if (inputVisible && inputRef.current) inputRef.current.focus(); }, [inputVisible]);

  const removeTag = (tag) => {
    const next = tags.filter(t => t !== tag);
    setTags(next);
    onChange(next.join(','));
  };

  const addTag = () => {
    if (inputVal.trim() && !tags.includes(inputVal.trim())) {
      const next = [...tags, inputVal.trim()];
      setTags(next);
      onChange(next.join(','));
    }
    setInputVal('');
    setInputVisible(false);
  };

  const tagColors = ['blue', 'geekblue', 'purple', 'magenta', 'volcano', 'gold', 'lime', 'green'];

  return (
    <div className="tag-list" onClick={e => e.stopPropagation()}>
      {tags.map((t, i) => (
        <Tag key={t} color={tagColors[i % tagColors.length]} closable onClose={() => removeTag(t)} style={{ margin: 0 }}>{t}</Tag>
      ))}
      {inputVisible ? (
        <Input ref={inputRef} className="tag-input" size="small" value={inputVal}
          onChange={e => setInputVal(e.target.value)} onPressEnter={addTag}
          onBlur={addTag} onKeyDown={e => { if (e.key === 'Escape') { setInputVisible(false); setInputVal(''); } }} />
      ) : (
        <Tag style={{ borderStyle: 'dashed', cursor: 'pointer', margin: 0 }} onClick={() => setInputVisible(true)}>+ 标签</Tag>
      )}
    </div>
  );
}

function ProductPicker({ visible, onCancel, onConfirm, existingProducts }) {
  const [products, setProducts] = useState([]);
  const [loading, setLoading] = useState(false);
  const [keyword, setKeyword] = useState('');
  const [total, setTotal] = useState(0);
  const [page, setPage] = useState(1);
  const [selected, setSelected] = useState([]);

  useEffect(() => {
    if (visible) {
      const existing = [];
      const ids = Array.isArray(existingProducts.ids) ? existingProducts.ids : [];
      const titles = Array.isArray(existingProducts.titles) ? existingProducts.titles : [];
      ids.forEach((id, i) => { existing.push({ id, title: titles[i] || id }); });
      setSelected(existing);
      fetchProducts(1);
    }
  }, [visible]);

  const fetchProducts = useCallback(async (p = 1, kw = keyword) => {
    setLoading(true);
    try {
      const params = new URLSearchParams({ page: String(p), limit: '20' });
      if (kw) params.set('keyword', kw);
      const res = await fetch(`${API_BASE}/api/products/search?${params}`);
      const json = await res.json();
      setProducts(json.data || []);
      setTotal(json.total || 0);
      setPage(p);
    } catch (e) { message.error('加载商品失败'); }
    setLoading(false);
  }, [keyword]);

  const toggleProduct = (product) => {
    const exists = selected.find(s => s.id === product._id);
    if (exists) {
      setSelected(selected.filter(s => s.id !== product._id));
    } else {
      setSelected([...selected, { id: product._id, title: product.title }]);
    }
  };

  const isSelected = (productId) => selected.some(s => s.id === productId);

  return (
    <Modal title="选取购买产品（可多选）" open={visible} onCancel={onCancel}
      onOk={() => onConfirm(selected)} okText="确认选取" cancelText="取消" width={750} destroyOnClose>
      <div style={{ marginBottom: 12 }}>
        <Search placeholder="搜索商品标题" onSearch={(v) => { setKeyword(v); fetchProducts(1, v); }} allowClear style={{ width: '100%' }} />
      </div>
      {selected.length > 0 && (
        <div style={{ marginBottom: 10, padding: '8px 12px', background: '#fafafa', borderRadius: 6 }}>
          <span style={{ color: '#666', marginRight: 8 }}>已选 {selected.length} 件：</span>
          {selected.map(s => (
            <Tag key={s.id} closable onClose={() => toggleProduct({ _id: s.id })} color="blue">{s.title}</Tag>
          ))}
        </div>
      )}
      <div style={{ maxHeight: 350, overflowY: 'auto', border: '1px solid #f0f0f0', borderRadius: 6 }}>
        {loading ? <div style={{ padding: 40, textAlign: 'center', color: '#999' }}>加载中...</div> :
         products.length === 0 ? <div style={{ padding: 40, textAlign: 'center', color: '#999' }}>无匹配商品</div> :
         products.map(p => (
           <div key={p._id} className={`product-picker-item ${isSelected(p._id) ? 'selected' : ''}`} onClick={() => toggleProduct(p)}>
             {p.images && p.images[0] ? <img src={p.images[0]} alt="" /> : <div style={{width:40,height:40,background:'#f0f0f0',borderRadius:4,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>🌸</div>}
             <div style={{ flex: 1 }}>
               <div style={{ fontWeight: 500 }}>{p.title}</div>
               <div style={{ fontSize: 12, color: '#999' }}>{p.category || ''} {p.price ? `¥${p.price}` : ''}</div>
             </div>
             <input type="checkbox" checked={isSelected(p._id)} readOnly style={{ width: 18, height: 18, cursor: 'pointer' }} />
           </div>
         ))}
      </div>
      {total > 20 && <div style={{ marginTop: 8, textAlign: 'center' }}>
        <Button size="small" disabled={page <= 1} onClick={() => fetchProducts(page - 1)}>上一页</Button>
        <span style={{ margin: '0 8px', color: '#999' }}>{page} / {Math.ceil(total / 20)}</span>
        <Button size="small" disabled={page >= Math.ceil(total / 20)} onClick={() => fetchProducts(page + 1)}>下一页</Button>
      </div>}
    </Modal>
  );
}


function OrderTagCell({ value, onChange, tagPool = [] }) {
  const [open, setOpen] = React.useState(false);
  const [allTags, setAllTags] = React.useState([]);
  const tags = Array.isArray(value) ? value : [];
  const displayTags = allTags.length ? allTags : tagPool;
  const load = async () => {
    try {
      const r = await fetch(`${TAG_API_BASE}/api/tags?scope=order`);
      const j = await r.json();
      setAllTags(j.data || []);
    } catch(e) { setAllTags([]); }
  };
  return (
    <span onDoubleClick={(e) => { e.stopPropagation(); load(); setOpen(true); }}
      style={{ display:'inline-flex', gap:4, flexWrap:'wrap', minHeight:22, cursor:'pointer', padding:'2px 4px' }}>
      {tags.length === 0 && <span style={{color:'#bbb',fontSize:12}}>双击添加</span>}
      {tags.map(t => {
        const meta = displayTags.find(x => x.name === t) || {};
        return (
          <Tag key={t} color={meta.color || undefined}
               style={meta.bg ? { background: meta.bg, color: meta.color, borderColor: meta.border } : {}}
               closable onClose={(e) => { e.preventDefault(); onChange(tags.filter(x => x !== t)); }}>
            {t}
          </Tag>
        );
      })}
      <Modal open={open} onCancel={() => setOpen(false)} onOk={() => setOpen(false)}
             title="选择/新增标签" footer={null} width={520}>
        <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:12}}>
          {allTags.map(t => {
            const on = tags.includes(t.name);
            return (
              <span key={t.name}
                onClick={() => onChange(on ? tags.filter(x => x !== t.name) : [...tags, t.name])}
                style={{
                  cursor:'pointer', padding:'4px 10px', borderRadius:12, fontSize:13,
                  background: on ? (t.bg || '#e6f7ff') : '#fafafa',
                  color: on ? (t.color || '#1890ff') : '#666',
                  border: '1px solid ' + (on ? (t.border || '#91d5ff') : '#eee'),
                  fontWeight: on ? 600 : 400,
                }}>{t.name}{typeof t.usage_count === 'number' ? ` (${t.usage_count})` : ''}</span>
            );
          })}
          {allTags.length === 0 && <span style={{color:'#999'}}>暂无标签，请在<a href="/tags-admin" target="_blank">标签总控台</a>新建 scope=order 的标签</span>}
        </div>
        <div style={{marginTop:8,fontSize:12,color:'#666'}}>💡 已选：{tags.length ? tags.join('、') : '无'}</div>
      </Modal>
    </span>
  );
}


function App() {
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(false);
  const [pagination, setPagination] = useState({ current: 1, pageSize: 20, total: 0 });
  const [search, setSearch] = useState('');
  const [businessType, setBusinessType] = useState('');
  const [monthFilter, setMonthFilter] = useState(''); // YYYY-MM
  const [tagPool, setTagPool] = React.useState([]);
  const [showTagMgr, setShowTagMgr] = React.useState(false);
  const [showBatchTag, setShowBatchTag] = React.useState(false);
  const fetchTagPool = React.useCallback(async () => {
    try {
      const r = await fetch(`${TAG_API_BASE}/api/tags?scope=order`);
      const j = await r.json();
      setTagPool(j.data || []);
    } catch (e) {}
  }, []);
  React.useEffect(() => { fetchTagPool(); }, []);
  const [stats, setStats] = useState([]);
  const [amountStats, setAmountStats] = useState({ total_income: 0, total_shipping: 0, total_coupon: 0, row_count: 0 });
  const [monthlyStats, setMonthlyStats] = useState({ data: [], totals: { order_count: 0, total_income: 0, total_cost: 0, total_profit: 0, total_shipping: 0, total_coupon: 0, total_expense: 0 } });
  const [monthlyYear, setMonthlyYear] = useState(String(new Date().getFullYear()));
  const [mainTab, setMainTab] = useState('overview'); // 'overview' | 'monthly' | 'huaxiang'
  // (syncStatus 卡已移除 — 店铺监控 tab 现在实时拉上游)
  const [region, setRegion] = useState('cn');
  const [shopName, setShopName] = useState('全部');
  const [shopStats, setShopStats] = useState([]);
  const [tagStats, setTagStats] = useState([]);
  const [tagFilter, setTagFilter] = useState('');
  const [syncStatus, setSyncStatus] = useState(null); // 已废弃, 保留仅为兼容旧代码
  const [selectedRowKeys, setSelectedRowKeys] = useState([]);
  const [pickerVisible, setPickerVisible] = useState(false);
  const [pickingOrderId, setPickingOrderId] = useState(null);
  const [pickingExisting, setPickingExisting] = useState({ ids: [], titles: [] });

  const fetchData = useCallback(async (page = 1, pageSize = 20, searchVal = search, typeVal = businessType, regionVal = region, shopVal = shopName, monthVal = monthFilter) => {
    setLoading(true);
    try {
      const params = new URLSearchParams({ page, limit: pageSize });
      if (searchVal) params.set('search', searchVal);
      if (typeVal && typeVal !== '全部') params.set('business_type', typeVal);
      if (regionVal) params.set('region', regionVal);
      if (shopVal && shopVal !== '全部') params.set('shop_name', shopVal);
      if (tagFilter) params.set('tag', tagFilter);
      if (monthVal) params.set('month', monthVal);
      const res = await fetch(`${API_BASE}/api/orders?${params}`);
      const json = await res.json();
      setData(json.data || []);
      setPagination(prev => ({ ...prev, current: json.page || page, total: json.total || 0, pageSize }));
    } catch (e) { message.error('加载失败'); }
    setLoading(false);
  }, [search, businessType, region, shopName, monthFilter]);

  const fetchTagStats = useCallback(async () => {
    try {
      const res = await fetch(`${API_BASE}/api/orders/stats/tags`);
      const json = await res.json();
      setTagStats(json.data || []);
    } catch (e) { setTagStats([]); }
  }, []);
  const fetchStats = useCallback(async () => {
    try {
      const res = await fetch(`${API_BASE}/api/orders/stats/business-type`);
      const json = await res.json();
      setStats(json.data || []);
    } catch (e) {}
  }, []);

  const fetchShopStats = useCallback(async () => {
    try {
      const res = await fetch(`${API_BASE}/api/orders/stats/shop-name`);
      const json = await res.json();
      setShopStats(json.data || []);
    } catch (e) {}
  }, []);

  const fetchAmountStats = useCallback(async (searchVal = search, typeVal = businessType, regionVal = region, shopVal = shopName, monthVal = monthFilter) => {
    try {
      const params = new URLSearchParams();
      if (searchVal) params.set('search', searchVal);
      if (typeVal && typeVal !== '全部') params.set('business_type', typeVal);
      if (regionVal) params.set('region', regionVal);
      if (shopVal && shopVal !== '全部') params.set('shop_name', shopVal);
      if (tagFilter) params.set('tag', tagFilter);
      if (monthVal) params.set('month', monthVal);
      const res = await fetch(`${API_BASE}/api/orders/stats/amount?${params}`);
      const json = await res.json();
      setAmountStats(json.data || { total_income: 0, total_shipping: 0, total_coupon: 0, row_count: 0 });
    } catch (e) {}
  }, [search, businessType, region, shopName, monthFilter, tagFilter]);


  // 同步状态卡已移除 — formatSyncTime 仅供其他模块使用 (保留函数避免报 undef)
  const formatSyncTime = (val) => val ? dayjs(val).format('YYYY-MM-DD HH:mm:ss') : '-';

  const fetchMonthlyStats = useCallback(async (yearVal = monthlyYear) => {
    try {
      const params = new URLSearchParams();
      if (yearVal) params.set('year', yearVal);
      const res = await fetch(`${API_BASE}/api/orders/stats/monthly?${params}`);
      const json = await res.json();
      setMonthlyStats(json || { data: [], totals: {} });
    } catch (e) { setMonthlyStats({ data: [], totals: {} }); }
  }, [monthlyYear]);

  useEffect(() => { fetchData(); fetchStats(); fetchShopStats(); fetchAmountStats(); fetchTagStats(); fetchMonthlyStats(); }, []);
  useEffect(() => { fetchData(); }, [tagFilter]);
  useEffect(() => { fetchMonthlyStats(); }, [monthlyYear]);

  const handleTableChange = (pag) => { fetchData(pag.current, pag.pageSize, search, businessType, region, shopName); };
  const onSearch = (val) => { setSearch(val); fetchData(1, 20, val, businessType, region, shopName); fetchAmountStats(val, businessType, region, shopName); };

  const updateCell = async (id, field, value) => {
    try {
      await fetch(`${API_BASE}/api/orders/${id}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ [field]: value }),
      });
      message.success('已更新');
      fetchData(pagination.current);
      fetchAmountStats(search, businessType, region, shopName, monthFilter);
    } catch (e) { message.error('更新失败'); }
  };

  const handleAdd = async () => {
    try {
      const res = await fetch(`${API_BASE}/api/orders`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ business_type: '未设置' }),
      });
      if (res.ok) {
        message.success('已新增空行');
        fetchData(1);
        fetchStats();
        fetchAmountStats(search, businessType, region, shopName, monthFilter);
      } else {
        const d = await res.json();
        message.error(d.error || '新增失败');
      }
    } catch (e) { message.error('新增失败'); }
  };

  const handleDuplicate = async () => {
    if (selectedRowKeys.length === 0) { message.warning('请先选择要复制的记录'); return; }
    try {
      const res = await fetch(`${API_BASE}/api/orders/duplicate`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids: selectedRowKeys }),
      });
      if (res.ok) {
        const d = await res.json();
        if (d.errors && d.errors.length) {
          const firstError = d.errors[0]?.error || '未知错误';
          message.warning(`已复制 ${d.duplicated} 条记录，${d.errors.length} 条失败：${firstError}`);
        } else {
          message.success(`已复制 ${d.duplicated} 条记录`);
        }
        setSelectedRowKeys([]);
        fetchData(1);
        fetchStats();
        fetchAmountStats(search, businessType, region, shopName, monthFilter);
      } else {
        const d = await res.json();
        message.error(d.error || '复制失败');
      }
    } catch (e) { message.error('复制失败'); }
  };

  const handleBatchDelete = async () => {
    if (selectedRowKeys.length === 0) { message.warning('请先选择要删除的记录'); return; }
    try {
      const res = await fetch(`${API_BASE}/api/orders/batch-delete`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids: selectedRowKeys }),

      const rows = d.data || [];
      if (!rows.length) { message.warning({ content: '无数据', key: 'settle' }); return; }
      const headers = ['订单号','订单时间','收货人','手机号','收货地址','店铺名','业务类型','商品明细','订单总价','运费','优惠','销售额','成本','利润','支付渠道','订单状态','发货状态','支付状态','标签','区域'];
      const esc = (v) => { const ss = String(v == null ? '' : v).replace(/"/g,'""'); return /[",\n]/.test(ss) ? '"'+ss+'"' : ss; };
      const money = (v) => Number(v || 0).toFixed(2);
      const lines = [headers.join(',')];
      let ti = 0, tc = 0, tp = 0;
      rows.forEach(o => {
        const titles = Array.isArray(o.product_title) ? o.product_title.join(' | ') : (o.product_title || '');
        const tags = Array.isArray(o.tags) ? o.tags.join('|') : (o.personal_tag || '');

        tc += Number(o.cost_amount || 0);
        tp += Number(o.profit_amount || 0);
        lines.push([
          o.payment_order_id || o.source_order_sn || o.id,
          dayjs(o.purchase_time).format('YYYY-MM-DD HH:mm'),
          o.consignee, o.phone, o.delivery_address,
          o.shop_name, o.business_type, titles,
          money(o.product_subtotal), money(o.shipping_fee), money(o.coupon_discount),

          o.payment_channel, o.order_status, o.shipping_status, o.pay_status,
          tags, o.region

// ============ 订单 · 批量打标签 ============
function OrderBatchTagModal({ ids, tagPool, onClose, onSaved }) {
  const [selected, setSelected] = React.useState(new Set());
  const [mode, setMode] = React.useState('add');
  const [busy, setBusy] = React.useState(false);
  const toggle = (n) => { const x = new Set(selected); if (x.has(n)) x.delete(n); else x.add(n); setSelected(x); };
  const save = async () => {
    if (selected.size === 0) return message.warning('请先选择标签');
    setBusy(true);
    try {
      const r = await fetch(`${TAG_API_BASE}/api/tags/apply`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ entity: 'order', ids, tags: [...selected], mode })
      });
      const d = await r.json();
      if (!d.success) throw new Error(d.error || '保存失败');
      message.success(`已${mode==='add'?'追加':mode==='remove'?'移除':'覆盖'}到 ${d.updated} 条订单`);
      onSaved();
    } catch (e) { message.error(e.message); setBusy(false); }
  };
  return (
    <Modal open={true} onCancel={onClose} footer={null} width={520}
      title={<span style={{color:'#3949ab'}}>🏷️ 批量打标签 · {ids.length} 条订单</span>}>
      <div style={{ marginBottom: 12, display: 'flex', gap: 12 }}>
        <label style={{ fontSize: 12, cursor: 'pointer' }}><input type="radio" checked={mode === 'add'} onChange={() => setMode('add')} /> 追加</label>
        <label style={{ fontSize: 12, cursor: 'pointer' }}><input type="radio" checked={mode === 'remove'} onChange={() => setMode('remove')} /> 移除</label>
        <label style={{ fontSize: 12, cursor: 'pointer' }}><input type="radio" checked={mode === 'set'} onChange={() => setMode('set')} /> 覆盖</label>
      </div>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 16, maxHeight: 320, overflow: 'auto' }}>
        {tagPool.map(t => {
          const on = selected.has(t.name);
          return (
            <span key={t.name} onClick={() => toggle(t.name)}
              style={{ cursor: 'pointer', padding: '4px 12px', borderRadius: 12, fontSize: 12, background: on ? (t.bg || '#f9f0ff') : '#fff', color: on ? (t.color || '#722ed1') : '#888', border: '1px solid ' + (on ? (t.border || '#d3adf7') : '#ddd'), fontWeight: on ? 600 : 400 }}>
              {on ? '✓ ' : ''}{t.name}{t.usage_count > 0 ? ` (${t.usage_count})` : ''}
            </span>
          );
        })}
        {tagPool.length === 0 && <span style={{ color: '#999', fontSize: 12 }}>标签池为空，请先到「🏷️ 标签管理」新建</span>}
      </div>
      <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
        <Button onClick={onClose}>取消</Button>
        <Button type="primary" loading={busy} onClick={save} disabled={selected.size === 0}
          style={{background:'#3949ab',borderColor:'#3949ab'}}>
          应用到 {ids.length} 条
        </Button>
      </div>
    </Modal>
  );
}


// ============ 🌐 外部订单同步 (花像花木 admin) ============
// ============ 🌐 外部订单监控 (花像花木 admin) ============

// 主账号 (北京花卉) + target platformId 模式: 任何店铺无需自带 token 都能监控/同步
// 主账号配置: shops 表 shop_name='北京花卉' 的 huaxiang_api_token + huaxiang_cookie
// 监控流程: 选店铺 → "预览" → 后端用主账号 token 调上游 findPlatformOrders.jhtml?platformId={target.platformId} → 展示
// 同步流程: "同步到订单库" → 后端把上游订单 upsert 到 purchase_orders (source_table='huaxiang_porder'),返回 inserted/updated/skipped 数量
function HuaxiangMonitorTab({ apiBase, onBack }) {
  const [shops, setShops] = useState([]);
  const [shopsBusy, setShopsBusy] = useState(false);
  const [shopsErr, setShopsErr] = useState('');
  const [master, setMaster] = useState(null);
  const [monitors, setMonitors] = useState({});
  const [days, setDays] = useState(30);
  const [orderStatus, setOrderStatus] = useState('');
  const [paymentMethod, setPaymentMethod] = useState('0');

  const fetchShops = useCallback(async () => {
    setShopsBusy(true); setShopsErr('');
    try {
      const r = await fetch(`${apiBase}/api/orders/huaxiang/shops`);
      const j = await r.json();
      setShops(j.data || []);
      const m = (j.data || []).find(s => s.shop_name === '北京花卉' && s.huaxiang_api_base);
      setMaster(m || null);
    } catch (e) { setShopsErr('加载店铺列表失败: ' + e.message); }
    setShopsBusy(false);
  }, [apiBase]);

  useEffect(() => { fetchShops(); }, [fetchShops]);

  const runPreview = async (shop) => {
    const sid = String(shop.id);
    setMonitors(prev => ({ ...prev, [sid]: { ...(prev[sid] || {}), shop, busy: true, syncing: false, err: '', rows: [], total: 0 } }));
    try {
      const params = new URLSearchParams({ shopId: sid, days: String(days), orderStatus, paymentMethod, maxPages: '5' });
      const r = await fetch(`${apiBase}/api/orders/huaxiang/shop-monitor?${params.toString()}`);
      const j = await r.json();
      if (!r.ok || j.error) throw new Error(j.error || `HTTP ${r.status}`);
      setMonitors(prev => ({ ...prev, [sid]: { ...(prev[sid] || {}), shop, busy: false, syncing: false, err: '', rows: j.rows || [], total: j.total || j.count || 0, fetchedAt: new Date() } }));
    } catch (e) {
      setMonitors(prev => ({ ...prev, [sid]: { ...(prev[sid] || {}), shop, busy: false, syncing: false, err: e.message } }));
      message.error(`预览 ${shop.shop_name} 失败: ${e.message}`);
    }
  };

  const runSync = async (shop) => {
    const sid = String(shop.id);
    setMonitors(prev => ({ ...prev, [sid]: { ...(prev[sid] || {}), shop, busy: false, syncing: true, err: '' } }));
    try {
      const body = JSON.stringify({ shopId: sid, startTime: '', endTime: '', orderStatus, paymentMethod, sort: false, maxPages: 30, pageSize: 50 });
      const r = await fetch(`${apiBase}/api/orders/sync-huaxiang`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body,
      });
      const j = await r.json();
      if (!r.ok || !j.success) throw new Error(j.error || `HTTP ${r.status}`);
      const stats = { inserted: j.inserted || 0, updated: j.updated || 0, skipped: j.skipped || 0, scanned: j.scanned || 0, errors: j.errors || 0 };
      setMonitors(prev => ({ ...prev, [sid]: { ...(prev[sid] || {}), shop, busy: false, syncing: false, err: '', lastSync: new Date(), lastSyncStats: stats } }));
      message.success(`${shop.shop_name} 同步完成: 拉取 ${stats.scanned} · 新增 ${stats.inserted} · 更新 ${stats.updated} · 跳过 ${stats.skipped}${stats.errors ? ` · 错误 ${stats.errors}` : ''}`);
      setTimeout(() => runPreview(shop), 500);
    } catch (e) {
      setMonitors(prev => ({ ...prev, [sid]: { ...(prev[sid] || {}), shop, busy: false, syncing: false, err: e.message } }));
      message.error(`同步 ${shop.shop_name} 失败: ${e.message}`);
    }
  };

  const runSyncAll = async () => {
    if (!shops.length) { message.warning('暂无店铺'); return; }
    Modal.confirm({
      title: `全部同步 ${shops.length} 个店铺?`,
      content: '会依次调用 /sync-huaxiang 写入 purchase_orders (按店铺单). 可能需要 1-3 分钟.',
      okText: '开始同步', cancelText: '取消',
      onOk: async () => {
        const hide = message.loading('全部同步中...', 0);
        let totalInserted = 0, totalUpdated = 0, totalErrors = 0;
        for (const shop of shops) {
          try {
            const r = await fetch(`${apiBase}/api/orders/sync-huaxiang`, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ shopId: String(shop.id), startTime: '', endTime: '', orderStatus, paymentMethod, maxPages: 30, pageSize: 50 }),
            });
            const j = await r.json();
            if (j.success) {
              totalInserted += (j.inserted || 0);
              totalUpdated += (j.updated || 0);
              totalErrors += (j.errors || 0);
              message.success(`${shop.shop_name}: 新增 ${j.inserted||0} 更新 ${j.updated||0}`, 1);
            } else {
              totalErrors += 1;
              message.error(`${shop.shop_name}: ${j.error}`, 2);
            }
          } catch (e) {
            totalErrors += 1;
            message.error(`${shop.shop_name}: ${e.message}`, 2);
          }
        }
        hide();
        message.success(`全部完成: 新增 ${totalInserted} · 更新 ${totalUpdated} · 错误 ${totalErrors}`);
        fetchShops();
      },
    });
  };

  const monitorColumns = [
    { title: '#', key: 'idx', width: 50, render: (_, r, i) => i + 1 },
    { title: '订单号', dataIndex: 'source_order_sn', width: 180, render: v => <span style={{fontFamily:'monospace',fontSize:12}}>{v || '-'}</span> },
    { title: '下单时间', dataIndex: 'purchase_time', width: 160, render: v => {
      if (!v) return '-';
      const n = Number(v);
      if (n > 1e12) return dayjs(n).format('YYYY-MM-DD HH:mm');
      return dayjs(v).format('YYYY-MM-DD HH:mm');
    } },
    { title: '收货人', dataIndex: 'consignee', width: 90 },
    { title: '手机', dataIndex: 'phone', width: 120 },
    { title: '地址', dataIndex: 'address', width: 220, ellipsis: true },
    { title: '商品', dataIndex: 'productName', ellipsis: true, render: v => v ? <span title={v}>🌸 {v}</span> : '-' },
    { title: '实付', dataIndex: 'payAmount', width: 90, align: 'right', render: v => <b style={{color:'#3f8600'}}>¥{Number(v||0).toFixed(2)}</b> },
    { title: '运费', dataIndex: 'freight', width: 80, align: 'right', render: v => '¥' + Number(v||0).toFixed(2) },
    { title: '优惠', dataIndex: 'coupon_discount', width: 80, align: 'right', render: v => Number(v||0) > 0 ? <span style={{color:'#fa8c16'}}>-¥{Number(v||0).toFixed(2)}</span> : '-' },
    { title: '支付方式', dataIndex: 'paymentMethod', width: 110 },
    { title: '订单', dataIndex: 'orderStatus', width: 80 },
    { title: '发货', dataIndex: 'shippingStatus', width: 80 },
    { title: '付款', dataIndex: 'paymentStatus', width: 80, render: v => {
      if (v == null || v === '') return '-';
      const map = { 0: '未支付', 1: '部分付', 2: '已支付', 3: '已退款' };
      const color = { 2: '#3f8600', 3: '#cf1322' };
      const txt = map[v] || (map[String(v)] || v);
      return <span style={{color: color[v] || '#666'}}>{txt}</span>;
    } },
  ];

  return (
    <Card size="small" style={{ marginBottom: 12 }} bodyStyle={{ padding: '14px 18px' }}
      title={<span><span style={{ color: '#722ed1', fontWeight: 600 }}>🌐 外部订单监控</span>
        <span style={{ fontSize: 12, color: '#888', marginLeft: 12 }}>通过"北京花卉"主账号拉花像花木上游订单,任何店铺都可不自带 token</span>
      </span>}
      extra={<Space>
        <Button size="small" type="primary" onClick={runSyncAll} disabled={!shops.length}>📥 全部同步</Button>
        <Button size="small" icon="🔄" onClick={fetchShops} loading={shopsBusy}>刷新店铺</Button>
        <Button size="small" onClick={() => onBack && onBack()}>← 返回总览</Button>
      </Space>}>

      {master ? (
        <Alert type="success" showIcon style={{ marginBottom: 12 }}
          message={<span><b>🔑 主账号已配置</b>: {master.shop_name} · platformId=<code>{master.huaxiang_platform_id}</code> · 所有店铺都通过该主账号访问上游,无需各自配 token</span>} />
      ) : (
        <Alert type="warning" showIcon style={{ marginBottom: 12 }}
          message={<span><b>⚠ 主账号"北京花卉"未配置 huaxiang_api_token</b> · 请到 <a href="http://100.96.54.109:31004" target="_blank" rel="noreferrer">店铺管理</a> 录入 token + cookie 后,本页才能监控订单</span>} />
      )}

      <Space wrap style={{ marginBottom: 14 }}>
        <span>监控最近</span>
        <Select value={days} onChange={setDays} style={{width:90}}
          options={[7,14,30,60,90].map(n => ({value:n, label:`${n} 天`}))} />
        <span style={{marginLeft:8}}>订单状态</span>
        <Select value={orderStatus} onChange={setOrderStatus} style={{width:120}}
          options={[
            {value:'', label:'全部'},
            {value:'0', label:'未确认'},
            {value:'1', label:'已确认'},
            {value:'2', label:'已完成'},
            {value:'3', label:'已取消'},
          ]} />
        <span style={{marginLeft:8}}>支付方式</span>
        <Select value={paymentMethod} onChange={setPaymentMethod} style={{width:120}}
          options={[
            {value:'0', label:'全部'},
            {value:'1', label:'微信收单'},
            {value:'2', label:'银联收单'},
            {value:'3', label:'线上支付'},
            {value:'4', label:'线下支付'},
          ]} />
      </Space>

      {shopsErr && <Alert type="error" message={shopsErr} style={{marginBottom:12}} />}

      {shops.length === 0 && !shopsBusy && (
        <div style={{padding:30, textAlign:'center', color:'#999', background:'#fafafa', borderRadius:6}}>
          暂无已配 huaxiang_platform_id 的店铺. 请到 <a href="http://100.96.54.109:31004" target="_blank" rel="noreferrer">店铺管理</a> 给店铺填上 platformId (花像花木 admin 的 platformId).
        </div>
      )}

      {shops.map(shop => {
        const sid = String(shop.id);
        const m = monitors[sid] || {};
        const lastSync = m.lastSyncStats;
        const matchedCount = (m.rows || []).filter(r => r.shop_name).length;
        const unmatchedCount = (m.rows || []).filter(r => !r.shop_name).length;
        return (
          <Card key={sid} size="small" style={{ marginBottom: 10 }} bodyStyle={{ padding: '12px 16px' }}
            title={
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:8}}>
                <span style={{display:'flex', alignItems:'center', gap:8, flexWrap:'wrap'}}>
                  <b style={{fontSize:15}}>{shop.shop_name}</b>
                  <Tag color="purple">platformId={shop.huaxiang_platform_id}</Tag>
                  {shop.has_token
                    ? <Tag color="green">🔑 自有 Token</Tag>
                    : <Tag color="orange">🔗 走主账号</Tag>}
                  {m.total > 0 && <Tag color="blue">上游 {m.total} 条</Tag>}
                  {lastSync && <Tag color="cyan">已同步 {lastSync.inserted + lastSync.updated} 条 ({dayjs(m.lastSync).format("MM-DD HH:mm")})</Tag>}
                  {lastSync && lastSync.errors > 0 && <Tag color="red">{lastSync.errors} 错</Tag>}
                </span>
                <Space>
                  <Button size="small" onClick={() => runPreview(shop)} loading={m.busy} disabled={m.syncing}>👁 预览</Button>
                  <Button size="small" type="primary" onClick={() => runSync(shop)} loading={m.syncing} disabled={m.busy}>📥 同步到订单库</Button>
                </Space>
              </div>
            }>
            {m.err && <Alert type="error" showIcon message={m.err} style={{marginBottom:8}} />}
            {m.busy && <div style={{padding:14, textAlign:'center', color:'#1677ff'}}>⏳ 预览拉取中,请稍候...</div>}
            {m.syncing && <div style={{padding:14, textAlign:'center', color:'#fa8c16'}}>📥 同步写入中(分页拉上游+ upsert 到 purchase_orders),请稍候...</div>}
            {m.rows && m.rows.length > 0 && (
              <>
                <div style={{marginBottom:8, color:'#666', fontSize:12, display:'flex', alignItems:'center', flexWrap:'wrap', gap:12}}>
                  <span>📊 上游共 <b>{m.total}</b> 条</span>
                  {matchedCount > 0 && <span style={{color:'#3f8600'}}>✓ 关联 {matchedCount}</span>}
                  {unmatchedCount > 0 && <span style={{color:'#faad14'}}>⚠ 未匹配 {unmatchedCount} 条(platformName={m.rows.find(r => !r.shop_name)?.platform_name || '?'})</span>}
                  <span style={{color:'#999'}}>拉取于 {dayjs(m.fetchedAt).format('YYYY-MM-DD HH:mm:ss')}</span>
                </div>
                <Table size="small" rowKey="source_order_sn"
                  dataSource={m.rows}
                  columns={monitorColumns}
                  pagination={{ pageSize: 10, showSizeChanger: true, showTotal: t => `共 ${t} 条` }}
                  scroll={{ x: 1500 }} />
              </>
            )}
            {m.rows && m.rows.length === 0 && !m.busy && !m.syncing && !m.err && (
              <div style={{padding:14, textAlign:'center', color:'#999', background:'#fafafa', borderRadius:6}}>未拉到订单 (上游范围内无符合条件的订单)</div>
            )}
          </Card>
        );
      })}
    </Card>
  );
}

  const div = document.createElement('div');
  div.id = 'build-version-marker';
  div.textContent = 'build: 2026-08-25 17:10 v3.0 (huaxiang master+sync button+UI redesign)';
  div.style.cssText = 'position:fixed;bottom:8px;right:8px;background:#52c41a;color:#fff;padding:4px 10px;border-radius:4px;font-size:11px;font-family:monospace;z-index:9999;opacity:0.85;box-shadow:0 2px 6px rgba(0,0,0,0.2);';
  document.body.appendChild(div);
})();
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
