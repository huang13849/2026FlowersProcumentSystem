apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-management-service
  namespace: supply-chain
  labels:
    app: user-management-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: user-management-service
  template:
    metadata:
      labels:
        app: user-management-service
    spec:
      nodeSelector:
        kubernetes.io/hostname: huangfra-ubun-master-ms-7e11
      containers:
        - name: user-management-service
          image: 100.96.54.109:5001/supply-chain/user-management-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3016
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3016"
            - name: ZITADEL_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: supply-chain-secrets
                  key: ZITADEL_PG_PASSWORD
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: supply-chain-secrets
                  key: PG_PASSWORD
            - name: ZITADEL_SYSTEM_KEY_PATH
              value: /system-key/systemuser.key
            - name: ZITADEL_URL
              value: http://zitadel.identity.svc.cluster.local:8080
            - name: ZITADEL_AUD
              value: http://id.horiculture.club:443
          envFrom:
            - configMapRef:
                name: supply-chain-common
          volumeMounts:
            - name: zitadel-system-key
              mountPath: /system-key
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3016
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3016
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
      volumes:
        - name: zitadel-system-key
          secret:
            secretName: zitadel-system-key
            items:
              - key: systemuser.key
                path: systemuser.key
---
apiVersion: v1
kind: Service
metadata:
  name: user-management-service
  namespace: supply-chain
  labels:
    app: user-management-service
spec:
  type: NodePort
  selector:
    app: user-management-service
  ports:
    - name: http
      port: 3016
      targetPort: 3016
      nodePort: 31016
      protocol: TCP
