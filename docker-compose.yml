services:
  ai-service:
    build: ./ai-service
    container_name: ai-service
    depends_on:
    - ollama
    env_file:
    - ./ai-service/.env
    ports:
    - 3003:3003
    restart: unless-stopped
  contract:
    build: ./contract-service
    container_name: contract-service
    env_file:
    - ./contract-service/.env
    ports:
    - 3006:3006
    restart: unless-stopped
  gateway:
    build: ./nginx-gateway
    container_name: nginx-gateway
    depends_on:
    - product
    - supplier
    - shop
    extra_hosts:
    - host.docker.internal:host-gateway
    ports:
    - 8088:80
    - 8090:8090
    restart: unless-stopped
  minio:
    command: server /data --console-address :9001
    container_name: minio
    env_file: ./production.secrets.env
    environment:
      MINIO_BROWSER: true
      MINIO_ROOT_USER: minioadmin
    healthcheck:
      interval: 30s
      retries: 3
      test:
      - CMD
      - mc
      - ready
      - local
      timeout: 10s
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    ports:
    - 9000:9000
    - 9001:9001
    restart: unless-stopped
    volumes:
    - /home/huangfra-ubun-master/minio-data:/data
  ollama:
    container_name: ollama
    environment:
    - OLLAMA_KEEP_ALIVE=24h
    image: ollama/ollama:latest
    ports:
    - 11434:11434
    restart: unless-stopped
    volumes:
    - /home/huangfra-ubun-master/ollama-models:/root/.ollama
  price:
    build: ./price-service
    container_name: price-service
    depends_on:
    - redis
    env_file: ./production.secrets.env
    extra_hosts:
    - host.docker.internal:host-gateway
    network_mode: host
    restart: unless-stopped
  product:
    build:
      context: ./product-service/backend
      dockerfile: Dockerfile
    container_name: product-service
    env_file:
    - ./product-service/.env
    - ./production.secrets.env
    ports:
    - 3001:3000
    restart: unless-stopped
    volumes:
    - /home/huangfra-ubun-master/picgo/uploads:/app/uploads
  publish:
    build: ./publish-service
    container_name: publish-service
    depends_on:
    - product
    - minio
    env_file:
    - ./publish-service/.env
    - ./production.secrets.env
    extra_hosts:
    - host.docker.internal:host-gateway
    ports:
    - 3005:3005
    restart: unless-stopped
    volumes:
    - publish_data:/app/data
  redis:
    command: redis-server --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    container_name: redis-cache
    healthcheck:
      interval: 10s
      retries: 3
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 3s
    image: redis:7-alpine
    ports:
    - 6379:6379
    restart: unless-stopped
  shop:
    build: ./shop-service
    container_name: shop-service
    env_file:
    - ./shop-service/backend/.env
    - ./production.secrets.env
    ports:
    - 3004:3004
    restart: unless-stopped
  supplier:
    build: ./supplier-service
    container_name: supplier-service
    env_file:
    - ./supplier-service/.env
    - ./production.secrets.env
    ports:
    - 3002:3002
    restart: unless-stopped
    volumes:
    - ./supplier-service/uploads:/app/uploads
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    network_mode: host
    env_file:
    - ./api-gateway/.env
    - ./production.secrets.env
    environment:
      PORT: '3007'
      MONGO_URI: mongodb://admin:Hy%401987921@100.67.126.90:27017/supply_chain?authSource=admin&replicaSet=rs0&readPreference=secondaryPreferred
      PG_HOST: 100.67.126.90
      PG_PORT: '5432'
      PG_USER: postgres
      REDIS_SENTINEL_HOSTS: 100.96.54.109:26379
      API_KEYS: ***REMOVED_API_KEY***,***REMOVED_API_KEY***
      INTERNAL_TOKEN: ***REMOVED_INTERNAL_TOKEN***
      REDIS_HOST: 100.96.54.109
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: nginx-exporter
    command:
    - -nginx.scrape-uri=http://host.docker.internal:8090/stub_status
    ports:
    - 9113:9113
    depends_on:
    - gateway
    restart: unless-stopped
    extra_hosts:
    - host.docker.internal:host-gateway
volumes:
  publish_data: null
