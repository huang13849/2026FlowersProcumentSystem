apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-web
  namespace: supply-chain
  labels:
    app: order-web
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: order-web } }
  template:
    metadata: { labels: { app: order-web } }
    spec:
      nodeName: xsyysj
      containers:
        - name: order-web
          image: 100.76.15.64:5001/supply-chain/order-web:latest
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 80 }
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: order-web
  namespace: supply-chain
spec:
  type: NodePort
  selector: { app: order-web }
  ports:
    - { name: http, port: 80, targetPort: 80, nodePort: 31009 }