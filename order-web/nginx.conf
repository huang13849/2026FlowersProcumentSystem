# ── order-web nginx config ──
# 静态文件 + /api/* 代理到 order-service backend

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源缓存
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 后端 API (前端 fetch ${API_BASE}/api/...)
    location /api/ {
        proxy_pass http://order-service:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA 路由 fallback (虽然 index.html 不是 SPA, 保留兜底)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}